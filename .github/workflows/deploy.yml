name: Deploy to k3s

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Phase 1: Detect changed components
  # ═══════════════════════════════════════════════════════════════

  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      api: ${{ steps.changes.outputs.api }}
      ui: ${{ steps.changes.outputs.ui }}
      hermes: ${{ steps.changes.outputs.hermes }}
      openclaw: ${{ steps.changes.outputs.openclaw }}
      worker: ${{ steps.changes.outputs.worker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "api=true"
              echo "ui=true"
              echo "hermes=true"
              echo "openclaw=true"
              echo "worker=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api=false; ui=false; hermes=false; openclaw=false; worker=false

          # A failed deploy must not become the baseline for the next run. Find
          # the last successful deploy on this branch and compare the whole
          # range to the current commit, so a later API-only fix also rebuilds
          # a UI change that was part of the failed attempt.
          baseline_sha="$(gh run list \
            --workflow deploy.yml \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // empty' 2>/dev/null || true)"

          if [ -z "$baseline_sha" ]; then
            echo "::warning::No successful deploy baseline found; building all components."
            build_all=true
          elif ! git cat-file -e "${baseline_sha}^{commit}" 2>/dev/null; then
            echo "::warning::Successful deploy baseline $baseline_sha is not available locally; building all components."
            build_all=true
          elif ! git merge-base --is-ancestor "$baseline_sha" "$GITHUB_SHA"; then
            echo "::warning::Successful deploy baseline $baseline_sha is not an ancestor of $GITHUB_SHA; building all components."
            build_all=true
          else
            echo "Using successful deploy $baseline_sha as the change baseline."
            git diff --name-only "$baseline_sha" "$GITHUB_SHA" > /tmp/changed.txt
            build_all=false
          fi

          if [ "$build_all" = true ]; then
            api=true; ui=true; hermes=true; openclaw=true; worker=true
          else
            if grep -qE '^(api/|Makefile$)' /tmp/changed.txt; then api=true; fi
            if grep -qE '^(ui/|Makefile$)' /tmp/changed.txt; then ui=true; fi
            if grep -q '^hermes-base/' /tmp/changed.txt; then hermes=true; fi
            if grep -q '^openclaw-base/' /tmp/changed.txt; then openclaw=true; fi
            if grep -q '^workers/' /tmp/changed.txt; then worker=true; fi
          fi

          {
            echo "api=$api"
            echo "ui=$ui"
            echo "hermes=$hermes"
            echo "openclaw=$openclaw"
            echo "worker=$worker"
          } >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════
  # Phase 2: Lint, test, build + push each changed component (parallel)
  # ═══════════════════════════════════════════════════════════════

  push-api:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.api == 'true' }}
    uses: ./.github/workflows/api.yml
    secrets: inherit
    with:
      push_image: true

  push-ui:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.ui == 'true' }}
    uses: ./.github/workflows/ui.yml
    secrets: inherit
    with:
      push_image: true

  push-hermes:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.hermes == 'true' }}
    uses: ./.github/workflows/hermes-base.yml
    secrets: inherit
    with:
      push_image: true

  push-openclaw:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.openclaw == 'true' }}
    uses: ./.github/workflows/openclaw-base.yml
    secrets: inherit
    with:
      push_image: true

  # ═══════════════════════════════════════════════════════════════
  # Phase 3: Resolve environment config
  # ═══════════════════════════════════════════════════════════════

  resolve-env:
    needs: [push-api, push-ui, push-hermes, push-openclaw]
    if: |
      always() && !cancelled() &&
      (needs.push-api.result == 'success' || needs.push-api.result == 'skipped') &&
      (needs.push-ui.result == 'success' || needs.push-ui.result == 'skipped') &&
      (needs.push-hermes.result == 'success' || needs.push-hermes.result == 'skipped') &&
      (needs.push-openclaw.result == 'success' || needs.push-openclaw.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.resolve.outputs.namespace }}
      environment: ${{ steps.resolve.outputs.environment }}
      litellm_key_service_account: ${{ steps.resolve.outputs.litellm_key_service_account }}
      api_host: ${{ steps.resolve.outputs.api_host }}
      ui_host: ${{ steps.resolve.outputs.ui_host }}
      web_app_url: ${{ steps.resolve.outputs.web_app_url }}
      api_image_tag: ${{ steps.image-versions.outputs.api_image_tag }}
      ui_image_tag: ${{ steps.image-versions.outputs.ui_image_tag }}
      openclaw_image_tag: ${{ steps.image-versions.outputs.openclaw_image_tag }}
      hermes_image_tag: ${{ steps.image-versions.outputs.hermes_image_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve environment
        id: resolve
        run: |
          case "${{ github.ref_name }}" in
            staging)
              {
                echo "namespace=agent-farm-staging"
                echo "environment=staging"
                echo "image_suffix=-staging"
                echo "service_image_tag=latest-staging"
                echo "litellm_key_service_account=agent-farm-staging-user"
                echo "api_host=${{ vars.STAGING_API_HOST }}"
                echo "ui_host=${{ vars.STAGING_UI_HOST }}"
                echo "web_app_url=${{ vars.STAGING_WEB_APP_URL }}"
              } >> "$GITHUB_OUTPUT"
              ;;
            main)
              {
                echo "namespace=agent-farm"
                echo "environment=production"
                echo "image_suffix="
                echo "service_image_tag=latest"
                echo "litellm_key_service_account=agent-farm-user"
                echo "api_host=${{ vars.API_HOST }}"
                echo "ui_host=${{ vars.UI_HOST }}"
                echo "web_app_url=${{ vars.WEB_APP_URL }}"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Deploy is only allowed from 'staging' or 'main' (got '${{ github.ref_name }}')."
              exit 1
              ;;
          esac
      - name: Read image versions
        id: image-versions
        env:
          IMAGE_SUFFIX: ${{ steps.resolve.outputs.image_suffix }}
          SERVICE_IMAGE_TAG: ${{ steps.resolve.outputs.service_image_tag }}
        run: |
          {
            echo "api_image_tag=${SERVICE_IMAGE_TAG}"
            echo "ui_image_tag=${SERVICE_IMAGE_TAG}"
            echo "openclaw_image_tag=$(cat openclaw-base/VERSION)${IMAGE_SUFFIX}"
            echo "hermes_image_tag=$(cat hermes-base/VERSION)${IMAGE_SUFFIX}"
          } >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════
  # Phase 4: Deploy
  # ═══════════════════════════════════════════════════════════════

  deploy:
    needs: [resolve-env]
    if: ${{ always() && needs.resolve-env.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install Helmfile
        run: |
          HELMFILE_VERSION=0.171.0
          curl -fsSL \
            https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin helmfile

      - name: Install helm-diff plugin
        run: helm plugin install https://github.com/databus23/helm-diff

      - name: Set up SSH tunnel to k3s
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.BASTION_SSH_KEY }}' > ~/.ssh/bastion_ed25519
          chmod 600 ~/.ssh/bastion_ed25519
          ssh -fN \
            -i ~/.ssh/bastion_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -L 6443:10.100.0.11:6443 \
            bastion@k8s.aai-labs.com
          sleep 3

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' '${{ github.ref_name == 'staging' && secrets.STAGING_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helmfile sync
        env:
          KUBECONFIG: /home/runner/.kube/config
          NAMESPACE: ${{ needs.resolve-env.outputs.namespace }}
          LITELLM_KEY_SERVICE_ACCOUNT: ${{ needs.resolve-env.outputs.litellm_key_service_account }}
          API_IMAGE_TAG: ${{ needs.resolve-env.outputs.api_image_tag }}
          UI_IMAGE_TAG: ${{ needs.resolve-env.outputs.ui_image_tag }}
          GIT_SHA: ${{ github.sha }}
          OPENCLAW_IMAGE_TAG: ${{ needs.resolve-env.outputs.openclaw_image_tag }}
          HERMES_IMAGE_TAG: ${{ needs.resolve-env.outputs.hermes_image_tag }}
          POSTGRES_APP_USER: ${{ vars.POSTGRES_APP_USER }}
          POSTGRES_APP_PASSWORD: ${{ github.ref_name == 'staging' && secrets.STAGING_POSTGRES_APP_PASSWORD || secrets.POSTGRES_APP_PASSWORD }}
          POSTGRES_APP_DB: ${{ vars.POSTGRES_APP_DB }}
          POSTGRES_LITELLM_USER: ${{ vars.POSTGRES_LITELLM_USER }}
          POSTGRES_LITELLM_PASSWORD: ${{ github.ref_name == 'staging' && secrets.STAGING_POSTGRES_LITELLM_PASSWORD || secrets.POSTGRES_LITELLM_PASSWORD }}
          POSTGRES_LITELLM_DB: ${{ vars.POSTGRES_LITELLM_DB }}
          POSTGRES_FIRECRAWL_USER: ${{ vars.POSTGRES_FIRECRAWL_USER }}
          POSTGRES_FIRECRAWL_PASSWORD: ${{ secrets.POSTGRES_FIRECRAWL_PASSWORD }}
          POSTGRES_FIRECRAWL_DB: ${{ vars.POSTGRES_FIRECRAWL_DB }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LITELLM_MASTER_KEY: ${{ github.ref_name == 'staging' && secrets.STAGING_LITELLM_MASTER_KEY || secrets.LITELLM_MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_DEFAULT_MODEL: ${{ vars.AGENT_DEFAULT_MODEL }}
          AGENT_MODEL_ALLOWLIST: ${{ vars.AGENT_MODEL_ALLOWLIST }}
          STORAGE_CLASS: ${{ vars.STORAGE_CLASS }}
          SECRET_SIGNING_KEY: ${{ github.ref_name == 'staging' && secrets.STAGING_SECRET_SIGNING_KEY || secrets.SECRET_SIGNING_KEY }}
          PLATFORM_ADMIN_CREDENTIALS: ${{ github.ref_name == 'staging' && secrets.STAGING_PLATFORM_ADMIN_CREDENTIALS || secrets.PLATFORM_ADMIN_CREDENTIALS }}
          AGENT_TOKEN_ENCRYPTION_KEY: ${{ github.ref_name == 'staging' && secrets.STAGING_AGENT_TOKEN_ENCRYPTION_KEY || secrets.AGENT_TOKEN_ENCRYPTION_KEY }}
          ENVIRONMENT: ${{ needs.resolve-env.outputs.environment }}
          WEB_APP_URL: ${{ needs.resolve-env.outputs.web_app_url }}
          GOOGLE_CLOUD_CLIENT_ID: ${{ vars.GOOGLE_CLOUD_CLIENT_ID }}
          GOOGLE_CLOUD_CLIENT_SECRET: ${{ secrets.GOOGLE_CLOUD_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENDER_EMAIL: ${{ github.ref_name == 'staging' && vars.STAGING_SENDER_EMAIL || vars.SENDER_EMAIL }}
          AGENT_EMAIL_DOMAIN: ${{ github.ref_name == 'staging' && vars.STAGING_AGENT_EMAIL_DOMAIN || vars.AGENT_EMAIL_DOMAIN }}
          EMAIL_INBOUND_SECRET: ${{ github.ref_name == 'staging' && secrets.STAGING_EMAIL_INBOUND_SECRET || secrets.EMAIL_INBOUND_SECRET }}
          API_HOST: ${{ needs.resolve-env.outputs.api_host }}
          UI_HOST: ${{ needs.resolve-env.outputs.ui_host }}
          KUBECONFIG_B64: ${{ github.ref_name == 'staging' && secrets.STAGING_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}
          POD_KUBECONFIG_B64: ${{ github.ref_name == 'staging' && secrets.STAGING_POD_KUBECONFIG_B64 || secrets.POD_KUBECONFIG_B64 }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ github.ref_name == 'staging' && secrets.STAGING_GRAFANA_ADMIN_PASSWORD || secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_HOST: ${{ github.ref_name == 'staging' && vars.STAGING_GRAFANA_HOST || vars.GRAFANA_HOST }}
        run: helmfile -f helmfile.yaml.gotmpl sync --wait

  # ═══════════════════════════════════════════════════════════════
  # Phase 5: Publish the Cloudflare Email Worker
  # ═══════════════════════════════════════════════════════════════

  # Runs after `deploy` on purpose: the Worker posts inbound mail into the
  # Communications service, so the cluster must already hold the matching
  # EMAIL_INBOUND_SECRET before the Worker starts presenting it.
  deploy-worker:
    needs: [detect-changes, resolve-env, deploy]
    if: ${{ needs.detect-changes.outputs.worker == 'true' && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/worker.yml
    secrets: inherit
    with:
      deploy: true
      environment: ${{ needs.resolve-env.outputs.environment }}
