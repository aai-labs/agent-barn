name: Deploy to k3s

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Reusable-workflow calls run against the same commit as this workflow, so
  # this is the actual CI gate: `build` below only starts once every one of
  # these succeeds. workflow_call ignores each workflow's own path filters, so
  # unlike their standalone push trigger, all four always run their full job
  # set here regardless of what changed -- consistent with `build` itself
  # always rebuilding and pushing all four images on every run below.
  api:
    uses: ./.github/workflows/api.yml
    secrets: inherit

  ui:
    uses: ./.github/workflows/ui.yml
    secrets: inherit

  hermes-base:
    uses: ./.github/workflows/hermes-base.yml
    secrets: inherit

  openclaw-base:
    uses: ./.github/workflows/openclaw-base.yml
    secrets: inherit

  # Split from `deploy` so a cluster-side failure (e.g. an immutable field on
  # an existing resource) can be retried via "re-run failed jobs" without
  # rebuilding/pushing every image again -- GitHub reuses this job's outputs
  # and doesn't re-run it once it has succeeded.
  build:
    needs: [api, ui, hermes-base, openclaw-base]
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.resolve-env.outputs.namespace }}
      environment: ${{ steps.resolve-env.outputs.environment }}
      litellm_key_service_account: ${{ steps.resolve-env.outputs.litellm_key_service_account }}
      api_host: ${{ steps.resolve-env.outputs.api_host }}
      ui_host: ${{ steps.resolve-env.outputs.ui_host }}
      web_app_url: ${{ steps.resolve-env.outputs.web_app_url }}
      api_image_tag: ${{ steps.image-versions.outputs.api_image_tag }}
      ui_image_tag: ${{ steps.image-versions.outputs.ui_image_tag }}
      openclaw_image_tag: ${{ steps.image-versions.outputs.openclaw_image_tag }}
      hermes_image_tag: ${{ steps.image-versions.outputs.hermes_image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve per-environment config from the branch this was dispatched from.
      # staging -> agent-farm-staging namespace, -staging image tags, no :latest,
      # STAGING_ hosts. main -> production. Any other branch is rejected so a
      # feature branch can never deploy to prod.
      - name: Resolve environment
        id: resolve-env
        run: |
          case "${{ github.ref_name }}" in
            staging)
              {
                echo "namespace=agent-farm-staging"
                echo "environment=staging"
                echo "image_suffix=-staging"
                echo "service_image_tag=latest-staging"
                echo "push_latest=false"
                # litellm-key hook runs as the deploy SA (already has secret perms)
                # instead of the out-of-band agent-farm-user.
                echo "litellm_key_service_account=agent-farm-staging-user"
                echo "api_host=${{ vars.STAGING_API_HOST }}"
                echo "ui_host=${{ vars.STAGING_UI_HOST }}"
                echo "web_app_url=${{ vars.STAGING_WEB_APP_URL }}"
              } >> "$GITHUB_OUTPUT"
              ;;
            main)
              {
                echo "namespace=agent-farm"
                echo "environment=production"
                echo "image_suffix="
                echo "service_image_tag=latest"
                echo "push_latest=true"
                echo "litellm_key_service_account=agent-farm-user"
                echo "api_host=${{ vars.API_HOST }}"
                echo "ui_host=${{ vars.UI_HOST }}"
                echo "web_app_url=${{ vars.WEB_APP_URL }}"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Deploy is only allowed from 'staging' or 'main' (got '${{ github.ref_name }}')."
              exit 1
              ;;
          esac

      # Tags carry the env's image_suffix (empty on main, -staging on staging) so
      # staging builds/deploys its own images and never clobbers prod's tags.
      - name: Read image versions
        id: image-versions
        env:
          IMAGE_SUFFIX: ${{ steps.resolve-env.outputs.image_suffix }}
          SERVICE_IMAGE_TAG: ${{ steps.resolve-env.outputs.service_image_tag }}
        run: |
          echo "api_image_tag=${SERVICE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ui_image_tag=${SERVICE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "openclaw_image_tag=$(cat openclaw-base/VERSION)${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "hermes_image_tag=$(cat hermes-base/VERSION)${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        run: |
          printf '%s' '${{ secrets.REGISTRY_PASSWORD }}' \
            | docker login '${{ vars.REGISTRY_URL }}' \
              --username '${{ vars.REGISTRY_USERNAME }}' \
              --password-stdin

      - name: Build and push API image
        env:
          API_IMAGE_TAG: ${{ steps.image-versions.outputs.api_image_tag }}
          PUSH_LATEST: ${{ steps.resolve-env.outputs.push_latest }}
        run: |
          docker build \
            -t '${{ vars.REGISTRY_URL }}/agentfarm-api:${{ env.API_IMAGE_TAG }}' \
            -f api/Dockerfile \
            .
          docker push '${{ vars.REGISTRY_URL }}/agentfarm-api:${{ env.API_IMAGE_TAG }}'
          if [ "${{ env.PUSH_LATEST }}" = "true" ]; then
            docker tag '${{ vars.REGISTRY_URL }}/agentfarm-api:${{ env.API_IMAGE_TAG }}' '${{ vars.REGISTRY_URL }}/agentfarm-api:latest'
            docker push '${{ vars.REGISTRY_URL }}/agentfarm-api:latest'
          fi

      - name: Extract primary API host
        id: primary-api-host
        env:
          API_HOST: ${{ steps.resolve-env.outputs.api_host }}
        run: echo "value=$(echo "$API_HOST" | cut -d',' -f1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Build and push UI image
        env:
          UI_IMAGE_TAG: ${{ steps.image-versions.outputs.ui_image_tag }}
          PUSH_LATEST: ${{ steps.resolve-env.outputs.push_latest }}
          PRIMARY_API_HOST: ${{ steps.primary-api-host.outputs.value }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://${{ env.PRIMARY_API_HOST }} \
            -t '${{ vars.REGISTRY_URL }}/agentfarm-ui:${{ env.UI_IMAGE_TAG }}' \
            -f ui/Dockerfile \
            ui/
          docker push '${{ vars.REGISTRY_URL }}/agentfarm-ui:${{ env.UI_IMAGE_TAG }}'
          if [ "${{ env.PUSH_LATEST }}" = "true" ]; then
            docker tag '${{ vars.REGISTRY_URL }}/agentfarm-ui:${{ env.UI_IMAGE_TAG }}' '${{ vars.REGISTRY_URL }}/agentfarm-ui:latest'
            docker push '${{ vars.REGISTRY_URL }}/agentfarm-ui:latest'
          fi

      - name: Build, smoke test, and push hermes-base image
        env:
          DOCKER_BUILDKIT: "1"
          HERMES_IMAGE_TAG: ${{ steps.image-versions.outputs.hermes_image_tag }}
          PUSH_LATEST: ${{ steps.resolve-env.outputs.push_latest }}
        run: |
          printf '%s' '${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}' > /tmp/gh_token
          docker build \
            --secret id=gh_token,src=/tmp/gh_token \
            -t '${{ vars.REGISTRY_URL }}/agentfarm-hermes-base:${{ env.HERMES_IMAGE_TAG }}' \
            -f hermes-base/Dockerfile \
            hermes-base/
          rm -f /tmp/gh_token
          docker run --rm \
            -v "${{ github.workspace }}/hermes-base/smoke-test.sh:/smoke-test.sh:ro" \
            '${{ vars.REGISTRY_URL }}/agentfarm-hermes-base:${{ env.HERMES_IMAGE_TAG }}' \
            /bin/sh /smoke-test.sh
          docker push '${{ vars.REGISTRY_URL }}/agentfarm-hermes-base:${{ env.HERMES_IMAGE_TAG }}'
          if [ "${{ env.PUSH_LATEST }}" = "true" ]; then
            docker tag '${{ vars.REGISTRY_URL }}/agentfarm-hermes-base:${{ env.HERMES_IMAGE_TAG }}' '${{ vars.REGISTRY_URL }}/agentfarm-hermes-base:latest'
            docker push '${{ vars.REGISTRY_URL }}/agentfarm-hermes-base:latest'
          fi

      - name: Build, smoke test, and push openclaw-base image
        env:
          DOCKER_BUILDKIT: "1"
          OPENCLAW_IMAGE_TAG: ${{ steps.image-versions.outputs.openclaw_image_tag }}
          PUSH_LATEST: ${{ steps.resolve-env.outputs.push_latest }}
        run: |
          printf '%s' '${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}' > /tmp/gh_token
          docker build \
            --secret id=gh_token,src=/tmp/gh_token \
            -t '${{ vars.REGISTRY_URL }}/agentfarm-openclaw-base:${{ env.OPENCLAW_IMAGE_TAG }}' \
            -f openclaw-base/Dockerfile \
            openclaw-base/
          rm -f /tmp/gh_token
          docker run --rm \
            -v "${{ github.workspace }}/openclaw-base/smoke-test.sh:/smoke-test.sh:ro" \
            '${{ vars.REGISTRY_URL }}/agentfarm-openclaw-base:${{ env.OPENCLAW_IMAGE_TAG }}' \
            /bin/sh /smoke-test.sh
          docker push '${{ vars.REGISTRY_URL }}/agentfarm-openclaw-base:${{ env.OPENCLAW_IMAGE_TAG }}'
          if [ "${{ env.PUSH_LATEST }}" = "true" ]; then
            docker tag '${{ vars.REGISTRY_URL }}/agentfarm-openclaw-base:${{ env.OPENCLAW_IMAGE_TAG }}' '${{ vars.REGISTRY_URL }}/agentfarm-openclaw-base:latest'
            docker push '${{ vars.REGISTRY_URL }}/agentfarm-openclaw-base:latest'
          fi

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install Helmfile
        run: |
          HELMFILE_VERSION=0.171.0
          curl -fsSL \
            https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin helmfile

      - name: Install helm-diff plugin
        run: helm plugin install https://github.com/databus23/helm-diff

      - name: Set up SSH tunnel to k3s
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.BASTION_SSH_KEY }}' > ~/.ssh/bastion_ed25519
          chmod 600 ~/.ssh/bastion_ed25519
          ssh -fN \
            -i ~/.ssh/bastion_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -L 6443:10.100.0.11:6443 \
            bastion@k8s.aai-labs.com
          sleep 3

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' '${{ github.ref_name == 'staging' && secrets.STAGING_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helmfile sync
        env:
          KUBECONFIG: /home/runner/.kube/config
          # Target namespace, resolved from the branch (agent-farm / agent-farm-staging).
          NAMESPACE: ${{ needs.build.outputs.namespace }}
          # SA the litellm-key hook runs as (staging: the namespace-scoped deploy SA).
          LITELLM_KEY_SERVICE_ACCOUNT: ${{ needs.build.outputs.litellm_key_service_account }}
          API_IMAGE_TAG: ${{ needs.build.outputs.api_image_tag }}
          UI_IMAGE_TAG: ${{ needs.build.outputs.ui_image_tag }}
          # Stamped into the api/ui/worker pod template annotations so a deploy
          # under a moving image tag (latest / latest-staging) still produces a
          # manifest diff and rolls the pods, even when the image tag string
          # itself is unchanged from the previous deploy.
          GIT_SHA: ${{ github.sha }}
          OPENCLAW_IMAGE_TAG: ${{ needs.build.outputs.openclaw_image_tag }}
          HERMES_IMAGE_TAG: ${{ needs.build.outputs.hermes_image_tag }}
          # DB user/db names are shared: each namespace has its own Postgres, so
          # identical names don't collide. Only the passwords/keys are per-env.
          POSTGRES_APP_USER: ${{ vars.POSTGRES_APP_USER }}
          POSTGRES_APP_PASSWORD: ${{ github.ref_name == 'staging' && secrets.STAGING_POSTGRES_APP_PASSWORD || secrets.POSTGRES_APP_PASSWORD }}
          POSTGRES_APP_DB: ${{ vars.POSTGRES_APP_DB }}
          POSTGRES_LITELLM_USER: ${{ vars.POSTGRES_LITELLM_USER }}
          POSTGRES_LITELLM_PASSWORD: ${{ github.ref_name == 'staging' && secrets.STAGING_POSTGRES_LITELLM_PASSWORD || secrets.POSTGRES_LITELLM_PASSWORD }}
          POSTGRES_LITELLM_DB: ${{ vars.POSTGRES_LITELLM_DB }}
          # Firecrawl (AF-152): helmfile hard-requires these; the release was
          # merged to staging without the env plumbing.
          POSTGRES_FIRECRAWL_USER: ${{ vars.POSTGRES_FIRECRAWL_USER }}
          POSTGRES_FIRECRAWL_PASSWORD: ${{ secrets.POSTGRES_FIRECRAWL_PASSWORD }}
          POSTGRES_FIRECRAWL_DB: ${{ vars.POSTGRES_FIRECRAWL_DB }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LITELLM_MASTER_KEY: ${{ github.ref_name == 'staging' && secrets.STAGING_LITELLM_MASTER_KEY || secrets.LITELLM_MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_DEFAULT_MODEL: ${{ vars.AGENT_DEFAULT_MODEL }}
          AGENT_MODEL_ALLOWLIST: ${{ vars.AGENT_MODEL_ALLOWLIST }}
          STORAGE_CLASS: ${{ vars.STORAGE_CLASS }}
          SECRET_SIGNING_KEY: ${{ github.ref_name == 'staging' && secrets.STAGING_SECRET_SIGNING_KEY || secrets.SECRET_SIGNING_KEY }}
          PLATFORM_ADMIN_CREDENTIALS: ${{ github.ref_name == 'staging' && secrets.STAGING_PLATFORM_ADMIN_CREDENTIALS || secrets.PLATFORM_ADMIN_CREDENTIALS }}
          AGENT_TOKEN_ENCRYPTION_KEY: ${{ github.ref_name == 'staging' && secrets.STAGING_AGENT_TOKEN_ENCRYPTION_KEY || secrets.AGENT_TOKEN_ENCRYPTION_KEY }}
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
          WEB_APP_URL: ${{ needs.build.outputs.web_app_url }}
          # Google OAuth client is shared; add the staging redirect URI in GCP Console.
          GOOGLE_CLOUD_CLIENT_ID: ${{ vars.GOOGLE_CLOUD_CLIENT_ID }}
          GOOGLE_CLOUD_CLIENT_SECRET: ${{ secrets.GOOGLE_CLOUD_CLIENT_SECRET }}
          # Email is prod-only. Inverted condition so the empty branch is intended
          # on staging (a plain `staging && STAGING_x || x` would fall back to prod
          # when STAGING_x is empty).
          EMAIL_SERVER_CREDENTIAL: ${{ github.ref_name == 'main' && secrets.EMAIL_SERVER_CREDENTIAL || '' }}
          EMAIL_SMTP_SERVER: ${{ github.ref_name == 'main' && vars.EMAIL_SMTP_SERVER || '' }}
          EMAIL_FROM_ADDRESS: ${{ github.ref_name == 'main' && vars.EMAIL_FROM_ADDRESS || '' }}
          API_HOST: ${{ needs.build.outputs.api_host }}
          UI_HOST: ${{ needs.build.outputs.ui_host }}
          KUBECONFIG_B64: ${{ github.ref_name == 'staging' && secrets.STAGING_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}
          POD_KUBECONFIG_B64: ${{ github.ref_name == 'staging' && secrets.STAGING_POD_KUBECONFIG_B64 || secrets.POD_KUBECONFIG_B64 }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ github.ref_name == 'staging' && secrets.STAGING_GRAFANA_ADMIN_PASSWORD || secrets.GRAFANA_ADMIN_PASSWORD }}
          # Per-env host: staging and prod each need their own DNS name — a
          # shared host would collide on traefik routing and the TLS cert.
          # (Same switch pattern as the staging branch's deploy.yml.)
          GRAFANA_HOST: ${{ github.ref_name == 'staging' && vars.STAGING_GRAFANA_HOST || vars.GRAFANA_HOST }}
        run: helmfile -f helmfile.yaml.gotmpl sync --wait
