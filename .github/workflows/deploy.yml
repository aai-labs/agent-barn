name: Deploy to k3s

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify component workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"

          check_workflow() {
            local workflow=$1
            local conclusion
            conclusion=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "not_found"')

            if [ "$conclusion" != "success" ] && [ "$conclusion" != "not_found" ]; then
              echo "::error::$workflow failed on $SHA (got: $conclusion)"
              return 1
            fi
            echo "$workflow: success"
          }

          check_workflow "api.yml"
          check_workflow "ui.yml"
          check_workflow "openclaw-base.yml"
          check_workflow "hermes-base.yml"

      - name: Read image versions
        run: |
          echo "API_IMAGE_TAG=$(grep '^\s*appVersion:' helm/agentfarm-api/Chart.yaml | awk '{print $2}' | tr -d '"')" >> $GITHUB_ENV
          echo "UI_IMAGE_TAG=$(grep '^\s*appVersion:' helm/agentfarm-ui/Chart.yaml | awk '{print $2}' | tr -d '"')" >> $GITHUB_ENV
          echo "OPENCLAW_IMAGE_TAG=$(cat openclaw-base/VERSION)" >> $GITHUB_ENV
          echo "HERMES_IMAGE_TAG=$(cat hermes-base/VERSION)" >> $GITHUB_ENV

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install Helmfile
        run: |
          HELMFILE_VERSION=0.171.0
          curl -fsSL \
            https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin helmfile

      - name: Install helm-diff plugin
        run: helm plugin install https://github.com/databus23/helm-diff

      - name: Log in to registry
        run: |
          printf '%s' '${{ secrets.REGISTRY_PASSWORD }}' \
            | docker login '${{ secrets.REGISTRY_URL }}' \
              --username '${{ secrets.REGISTRY_USERNAME }}' \
              --password-stdin

      - name: Build and push API image
        run: |
          docker build \
            -t '${{ secrets.REGISTRY_URL }}/agentfarm-api:${{ env.API_IMAGE_TAG }}' \
            -f api/Dockerfile \
            .
          docker push '${{ secrets.REGISTRY_URL }}/agentfarm-api:${{ env.API_IMAGE_TAG }}'

      - name: Build and push UI image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://${{ secrets.API_HOST }} \
            -t '${{ secrets.REGISTRY_URL }}/agentfarm-ui:${{ env.UI_IMAGE_TAG }}' \
            -f ui/Dockerfile \
            ui/
          docker push '${{ secrets.REGISTRY_URL }}/agentfarm-ui:${{ env.UI_IMAGE_TAG }}'

      - name: Build, smoke test, and push hermes-base image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          printf '%s' '${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}' > /tmp/gh_token
          docker build \
            --secret id=gh_token,src=/tmp/gh_token \
            -t '${{ secrets.REGISTRY_URL }}/agentfarm-hermes-base:${{ env.HERMES_IMAGE_TAG }}' \
            -f hermes-base/Dockerfile \
            hermes-base/
          rm -f /tmp/gh_token
          docker run --rm \
            -v "${{ github.workspace }}/hermes-base/smoke-test.sh:/smoke-test.sh:ro" \
            '${{ secrets.REGISTRY_URL }}/agentfarm-hermes-base:${{ env.HERMES_IMAGE_TAG }}' \
            /bin/sh /smoke-test.sh
          docker push '${{ secrets.REGISTRY_URL }}/agentfarm-hermes-base:${{ env.HERMES_IMAGE_TAG }}'

      - name: Build, smoke test, and push openclaw-base image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          printf '%s' '${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}' > /tmp/gh_token
          docker build \
            --secret id=gh_token,src=/tmp/gh_token \
            -t '${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:${{ env.OPENCLAW_IMAGE_TAG }}' \
            -f openclaw-base/Dockerfile \
            openclaw-base/
          rm -f /tmp/gh_token
          docker run --rm \
            -v "${{ github.workspace }}/openclaw-base/smoke-test.sh:/smoke-test.sh:ro" \
            '${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:${{ env.OPENCLAW_IMAGE_TAG }}' \
            /bin/sh /smoke-test.sh
          docker push '${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:${{ env.OPENCLAW_IMAGE_TAG }}'

      - name: Set up SSH tunnel to k3s
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.BASTION_SSH_KEY }}' > ~/.ssh/bastion_ed25519
          chmod 600 ~/.ssh/bastion_ed25519
          ssh -fN \
            -i ~/.ssh/bastion_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -L 6443:10.100.0.11:6443 \
            bastion@k8s.aai-labs.com
          sleep 3

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' '${{ secrets.KUBECONFIG_B64 }}' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helmfile sync
        env:
          KUBECONFIG: /home/runner/.kube/config
          API_IMAGE_TAG: ${{ env.API_IMAGE_TAG }}
          UI_IMAGE_TAG: ${{ env.UI_IMAGE_TAG }}
          OPENCLAW_IMAGE_TAG: ${{ env.OPENCLAW_IMAGE_TAG }}
          HERMES_IMAGE_TAG: ${{ env.HERMES_IMAGE_TAG }}
          POSTGRES_APP_USER: ${{ secrets.POSTGRES_APP_USER }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          POSTGRES_APP_DB: ${{ secrets.POSTGRES_APP_DB }}
          POSTGRES_LITELLM_USER: ${{ secrets.POSTGRES_LITELLM_USER }}
          POSTGRES_LITELLM_PASSWORD: ${{ secrets.POSTGRES_LITELLM_PASSWORD }}
          POSTGRES_LITELLM_DB: ${{ secrets.POSTGRES_LITELLM_DB }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECRET_SIGNING_KEY: ${{ secrets.SECRET_SIGNING_KEY }}
          SUPER_USER_CREDENTIALS: ${{ secrets.SUPER_USER_CREDENTIALS }}
          AGENT_TOKEN_ENCRYPTION_KEY: ${{ secrets.AGENT_TOKEN_ENCRYPTION_KEY }}
          ENVIRONMENT: production
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          API_HOST: ${{ secrets.API_HOST }}
          UI_HOST: ${{ secrets.UI_HOST }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          POD_KUBECONFIG_B64: ${{ secrets.POD_KUBECONFIG_B64 }}
          REGISTRY_SERVER: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: helmfile sync --wait
