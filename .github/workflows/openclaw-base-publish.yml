name: Openclaw Base Publish

on:
  workflow_run:
    workflows: ["Openclaw Base CI"]
    types: [completed]
    branches: [main]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI workflow concluded: ${{ github.event.workflow_run.conclusion }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: echo "tag=$(cat openclaw-base/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: openclaw-base
          file: openclaw-base/Dockerfile
          load: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/openclaw-base:${{ steps.version.outputs.tag }}
            ${{ secrets.REGISTRY_URL }}/openclaw-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/openclaw-base/smoke-test.sh:/smoke-test.sh:ro" \
            ${{ secrets.REGISTRY_URL }}/openclaw-base:${{ steps.version.outputs.tag }} \
            /bin/sh /smoke-test.sh

      - name: Push images
        run: |
          docker push ${{ secrets.REGISTRY_URL }}/openclaw-base:${{ steps.version.outputs.tag }}
          docker push ${{ secrets.REGISTRY_URL }}/openclaw-base:latest
