name: Openclaw Base

on:
  push:
    # deploy.yml calls this workflow directly (via workflow_call) as a
    # needs: prerequisite for staging/main pushes, so it isn't also
    # triggered standalone here -- that would run it twice for the same commit.
    branches-ignore:
      - staging
      - main
    paths:
      - openclaw-base/**
      - .github/workflows/openclaw-base.yml
      # The telemetry-contract check asserts the runtime still declares what the
      # plugin reads, so a plugin change must re-verify it rather than waiting
      # for the next image bump.
      - api/domains/agents/scripts/openclaw/plugins/**
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: openclaw-base
          file: openclaw-base/Dockerfile
          load: true
          tags: openclaw-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            gh_token=${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}
      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/openclaw-base/smoke-test.sh:/smoke-test.sh:ro" \
            openclaw-base:ci \
            /bin/sh /smoke-test.sh

