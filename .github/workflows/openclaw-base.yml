name: Openclaw Base

on:
  push:
    paths:
      - openclaw-base/**
      - .github/workflows/openclaw-base.yml

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: openclaw-base
          file: openclaw-base/Dockerfile
          load: true
          tags: openclaw-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/openclaw-base/smoke-test.sh:/smoke-test.sh:ro" \
            openclaw-base:ci \
            /bin/sh /smoke-test.sh

