name: Openclaw Base

on:
  push:
    paths:
      - openclaw-base/**
      - .github/workflows/openclaw-base.yml

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: openclaw-base
          file: openclaw-base/Dockerfile
          load: true
          tags: openclaw-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/openclaw-base/smoke-test.sh:/smoke-test.sh:ro" \
            openclaw-base:ci \
            /bin/sh /smoke-test.sh

  publish:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/AF-87-setup-ci-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "tag=$(cat openclaw-base/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: openclaw-base
          file: openclaw-base/Dockerfile
          load: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:${{ steps.version.outputs.tag }}
            ${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/openclaw-base/smoke-test.sh:/smoke-test.sh:ro" \
            ${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:${{ steps.version.outputs.tag }} \
            /bin/sh /smoke-test.sh

      - name: Push images
        run: |
          docker push ${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:${{ steps.version.outputs.tag }}
          docker push ${{ secrets.REGISTRY_URL }}/agentfarm-openclaw-base:latest
