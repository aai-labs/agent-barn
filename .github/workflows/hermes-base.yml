name: Hermes Base

on:
  push:
    # deploy.yml calls this workflow directly (via workflow_call) as a
    # needs: prerequisite for staging/main pushes, so it isn't also
    # triggered standalone here -- that would run it twice for the same commit.
    branches-ignore:
      - staging
      - main
    paths:
      - hermes-base/**
      - .github/workflows/hermes-base.yml
      # The plugin contract step below runs our plugin inside this image, so it
      # has to re-run when the plugin changes and not only on a version bump.
      - api/domains/agents/scripts/hermes/plugins/**
      - api/tests/fixtures/hermes_session_store_driver.py
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: hermes-base
          file: hermes-base/Dockerfile
          load: true
          tags: hermes-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            gh_token=${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}
      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/hermes-base/smoke-test.sh:/smoke-test.sh:ro" \
            hermes-base:ci \
            /bin/sh /smoke-test.sh
      # Runs the telemetry-push plugin against the runtime's real SessionStore.
      # Unit tests can only prove our own routing logic against fakes; this is
      # what proves the runtime still behaves the way those fakes assume.
      - name: Plugin contract
        run: |
          docker run --rm \
            -e AGENT_ID=00000000-0000-0000-0000-000000000000 \
            -e INGEST_URL=http://127.0.0.1:9/ingest/v1 \
            -e INGEST_API_KEY=ci \
            -v "${{ github.workspace }}/api/domains/agents/scripts/hermes/plugins/telemetry-push:/plugin:ro" \
            -v "${{ github.workspace }}/api/tests/fixtures/hermes_session_store_driver.py:/driver.py:ro" \
            --entrypoint python3 \
            hermes-base:ci \
            /driver.py
