name: Hermes Base

on:
  # Reusable only -- called by deploy.yml (staging/main, push_image: true)
  # and ci.yml (other branches/PRs, push_image: false).
  workflow_call:
    inputs:
      push_image:
        description: Whether to build and push the image to the registry
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # The rust build stage, the base image itself, and the Playwright/Chromium
      # install together push GitHub's default ~14GB free runner disk over the
      # edge during the final image export -- seen as a mid-build "no space left
      # on device" failure exporting Chromium locale files. Standard runners
      # ship with Android SDK/.NET/GHC/etc. preinstalled and unused here;
      # clearing them recovers tens of GB before the build starts.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: hermes-base
          file: hermes-base/Dockerfile
          load: true
          tags: hermes-base:ci
          # The rust-build stage clones aai-cli's default branch, but its RUN text never
          # changes, so Docker happily serves a months-old clone from cache and the image
          # silently ships a stale aai-cli. Nothing else here depends on remote state, so
          # only this stage opts out; the rest of the build still caches normally.
          no-cache-filters: rust-build
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            gh_token=${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}
      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/hermes-base/smoke-test.sh:/smoke-test.sh:ro" \
            hermes-base:ci \
            /bin/sh /smoke-test.sh
      - name: PVC permissions contract
        working-directory: api
        run: uv run --frozen python tests/fixtures/hermes_pvc_permissions_driver.py hermes-base:ci
      # Runs the telemetry-push plugin against the runtime's real SessionStore.
      # Unit tests can only prove our own routing logic against fakes; this is
      # what proves the runtime still behaves the way those fakes assume.
      - name: Plugin contract
        run: |
          docker run --rm \
            -e AGENT_ID=00000000-0000-0000-0000-000000000000 \
            -e INGEST_URL=http://127.0.0.1:9/ingest/v1 \
            -e INGEST_API_KEY=ci \
            -v "${{ github.workspace }}/api/domains/agents/scripts/hermes/plugins/telemetry-push:/plugin:ro" \
            -v "${{ github.workspace }}/api/tests/fixtures/hermes_session_store_driver.py:/driver.py:ro" \
            --entrypoint python3 \
            hermes-base:ci \
            /driver.py

  push:
    name: Push
    if: inputs.push_image
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # The rust build stage, the base image itself, and the Playwright/Chromium
      # install together push GitHub's default ~14GB free runner disk over the
      # edge during the final image export -- seen as a mid-build "no space left
      # on device" failure exporting Chromium locale files. Standard runners
      # ship with Android SDK/.NET/GHC/etc. preinstalled and unused here;
      # clearing them recovers tens of GB before the build starts.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Resolve image tag
        id: tag
        run: |
          version=$(tr -d '[:space:]' < hermes-base/VERSION)
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "value=${version}-staging" >> "$GITHUB_OUTPUT"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=${version}" >> "$GITHUB_OUTPUT"
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and load for smoke test
        uses: docker/build-push-action@v7
        with:
          context: hermes-base
          file: hermes-base/Dockerfile
          load: true
          tags: ${{ vars.REGISTRY_URL }}/agentbarn-hermes-base:${{ steps.tag.outputs.value }}
          # Only the first build in this job opts out — see the CI job above for why. The
          # Push steps then reuse the layer this one just built, so the image that ships is
          # the same one the smoke test ran against, at one compile rather than three.
          no-cache-filters: rust-build
          cache-from: type=gha
          secrets: |
            gh_token=${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}
      - name: Smoke test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/hermes-base/smoke-test.sh:/smoke-test.sh:ro" \
            ${{ vars.REGISTRY_URL }}/agentbarn-hermes-base:${{ steps.tag.outputs.value }} \
            /bin/sh /smoke-test.sh
      - name: PVC permissions contract
        working-directory: api
        run: |
          uv run --frozen python tests/fixtures/hermes_pvc_permissions_driver.py \
            ${{ vars.REGISTRY_URL }}/agentbarn-hermes-base:${{ steps.tag.outputs.value }}
      - name: Plugin contract
        run: |
          docker run --rm \
            -e AGENT_ID=00000000-0000-0000-0000-000000000000 \
            -e INGEST_URL=http://127.0.0.1:9/ingest/v1 \
            -e INGEST_API_KEY=ci \
            -v "${{ github.workspace }}/api/domains/agents/scripts/hermes/plugins/telemetry-push:/plugin:ro" \
            -v "${{ github.workspace }}/api/tests/fixtures/hermes_session_store_driver.py:/driver.py:ro" \
            --entrypoint python3 \
            ${{ vars.REGISTRY_URL }}/agentbarn-hermes-base:${{ steps.tag.outputs.value }} \
            /driver.py
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: hermes-base
          file: hermes-base/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_URL }}/agentbarn-hermes-base:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          secrets: |
            gh_token=${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}
      - name: Push latest tag
        if: steps.tag.outputs.push_latest == 'true'
        uses: docker/build-push-action@v7
        with:
          context: hermes-base
          file: hermes-base/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_URL }}/agentbarn-hermes-base:latest
          cache-from: type=gha
          secrets: |
            gh_token=${{ secrets.AAI_CLI_REPO_ACCESS_TOKEN }}
