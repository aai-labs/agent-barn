name: UI Publish

on:
  workflow_run:
    workflows: ["UI CI"]
    types: [completed]
    branches: [main]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI workflow concluded: ${{ github.event.workflow_run.conclusion }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: echo "tag=$(cat ui/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/agentfarm-ui:${{ steps.version.outputs.tag }}
            ${{ secrets.REGISTRY_URL }}/agentfarm-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
