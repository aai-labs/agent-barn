name: API

on:
  # Reusable only -- called by deploy.yml (staging/main, push_image: true)
  # and ci.yml (other branches/PRs, push_image: false).
  workflow_call:
    inputs:
      push_image:
        description: Whether to build and push the image to the registry
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - run: make check-api
      - run: make check-migrations

  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - run: make test-api

  test-k8s:
    name: Test k8s integration
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Open SSH tunnel to k3s
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.BASTION_SSH_KEY }}' > ~/.ssh/bastion_ed25519
          chmod 600 ~/.ssh/bastion_ed25519
          printf '%s' '${{ secrets.KUBECONFIG_B64 }}' | base64 -d > $RUNNER_TEMP/kubeconfig
          ssh -fN \
            -i ~/.ssh/bastion_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -L 6443:10.100.0.11:6443 \
            bastion@k8s.aai-labs.com
          sleep 3
          sed -i 's|server: https://.*|server: https://127.0.0.1:6443|' $RUNNER_TEMP/kubeconfig
      - name: Run k8s integration tests
        env:
          K8S_KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig
          K8S_NAMESPACE: agent-farm
        run: make test-api-k8s

  build:
    name: Build
    needs: [lint, test, test-k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: agentbarn-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push
    if: inputs.push_image
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "value=latest-staging" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_URL }}/agentbarn-api:${{ steps.tag.outputs.value }}
          cache-from: type=gha

