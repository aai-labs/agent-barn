name: API

on:
  push:
    paths:
      - api/**
      - Makefile
      - .github/workflows/api.yml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - run: make check-api

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - run: make test-api

  test-k8s:
    name: Test k8s integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Open SSH tunnel to k3s
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.BASTION_SSH_KEY }}' > ~/.ssh/bastion_ed25519
          chmod 600 ~/.ssh/bastion_ed25519
          ssh -o StrictHostKeyChecking=no -fN \
            -L 6443:10.100.0.11:6443 \
            bastion@k8s.aai-labs.com
          sleep 3
          CLUSTER_NAME="$(kubectl config view -o jsonpath='{.clusters[0].name}')"
          kubectl config set-cluster "$CLUSTER_NAME" --server=https://localhost:6443
      - name: Write KubeConfig
        run: printf '%s' '${{ secrets.KUBECONFIG_B64 }}' | base64 -d > $RUNNER_TEMP/kubeconfig
      - name: Run k8s integration tests
        env:
          K8S_KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig
          K8S_NAMESPACE: agent-farm
        run: make test-api-k8s

  build:
    name: Build
    needs: [lint, test, test-k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: agentfarm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

