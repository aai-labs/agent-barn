name: API

on:
  # Reusable only -- called by deploy.yml (staging/main, push_image: true)
  # and ci.yml (other branches/PRs, push_image: false).
  workflow_call:
    inputs:
      push_image:
        description: Whether to build and push the image to the registry
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - run: make check-api
      - run: make check-migrations

  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - run: make test-api

  test-k8s:
    name: Test k8s integration
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Create k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: agentfarm-ci
          # Pin k3d explicitly: the action's default (v5.4.6) is old enough that
          # its install now 404s. Keep in sync with docker/k3d/Dockerfile.
          k3d-version: v5.8.3
          args: --wait
      - name: Seed namespace
        # The integration test assumes the target namespace already exists but
        # does not create it (see tests/integration/test_kubernetes_client.py).
        run: kubectl create namespace agent-farm
      - name: Run k8s integration tests
        env:
          # k3d-action writes an admin kubeconfig to the default location, which
          # the client falls back to when K8S_KUBECONFIG_PATH is unset.
          K8S_NAMESPACE: agent-farm
        run: make test-api-k8s

  build:
    name: Build
    needs: [lint, test, test-k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: agentbarn-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push
    if: inputs.push_image
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "value=latest-staging" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_URL }}/agentbarn-api:${{ steps.tag.outputs.value }}
          cache-from: type=gha

