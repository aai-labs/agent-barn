name: API

on:
  push:
    paths:
      - api/**
      - Makefile
      - .github/workflows/api.yml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - run: make check-api

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Write KubeConfig
        run: echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $RUNNER_TEMP/kubeconfig
      - name: Run tests
        env:
          K8S_KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig
          K8S_NAMESPACE: agent-farm
        run: make test-api

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: agentfarm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

