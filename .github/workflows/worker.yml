name: Email inbound Worker

on:
  # Reusable only -- called by ci.yml (PRs/branches, deploy: false), by
  # deploy.yml (staging only, deploy: true), and by deploy-public.yml (release
  # tags, deploy: true). Each publish runs after its own cluster deploy, so the
  # cluster already holds the secret the Worker is about to present.
  workflow_call:
    inputs:
      deploy:
        description: Whether to publish the Worker to Cloudflare
        required: false
        type: boolean
        default: false
      environment:
        description: Wrangler environment to target (staging or production)
        required: false
        type: string
        default: ""
      ref:
        description: Commit to build the Worker from. Empty checks out the default for the event.
        required: false
        type: string
        default: ""

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: workers/email-inbound/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: workers/email-inbound/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: workers/email-inbound
        run: pnpm install --frozen-lockfile
      # `deploy --dry-run` bundles and resolves vars without contacting Cloudflare,
      # so this needs no credentials and works on pull requests from forks. Every
      # deployable environment is checked: a fault confined to one env block would
      # otherwise reach that environment unverified.
      - name: Bundle the Worker (staging)
        working-directory: workers/email-inbound
        run: pnpm exec wrangler deploy --dry-run --env staging
      - name: Bundle the Worker (prod)
        working-directory: workers/email-inbound
        run: pnpm exec wrangler deploy --dry-run --env prod
      - name: Bundle the Worker (cloud)
        working-directory: workers/email-inbound
        run: pnpm exec wrangler deploy --dry-run --env cloud

  publish:
    name: Publish
    if: inputs.deploy
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: workers/email-inbound/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: workers/email-inbound/pnpm-lock.yaml
      # Each secret is passed in separately and selected in shell, never through
      # `A && B || C`: that yields C whenever B is empty, so a guard written as
      # the same expression it guards would read the other environment's secret
      # and pass. Staging would then publish holding the production secret while
      # its cluster fell back to a third value, and every message would 401.
      # An unknown environment is rejected rather than silently treated as public.
      - name: Resolve the inbound secret for the target environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STAGING_SECRET: ${{ secrets.STAGING_EMAIL_INBOUND_SECRET }}
          PROD_SECRET: ${{ secrets.EMAIL_INBOUND_SECRET }}
          CLOUD_SECRET: ${{ secrets.PUBLIC_EMAIL_INBOUND_SECRET }}
        run: |
          case "$ENVIRONMENT" in
            staging) secret="$STAGING_SECRET" ;;
            prod)    secret="$PROD_SECRET" ;;
            cloud)   secret="$CLOUD_SECRET" ;;
            *) echo "::error::Unknown Worker environment '$ENVIRONMENT'"; exit 1 ;;
          esac
          [ -n "$secret" ] || { echo "::error::No inbound secret set for '$ENVIRONMENT'; every inbound email would 401."; exit 1; }
          echo "::add-mask::$secret"
          echo "EMAIL_INBOUND_SECRET=$secret" >> "$GITHUB_ENV"
      # EMAIL_INBOUND_SECRET comes from $GITHUB_ENV, written by the step above, so the
      # value checked is the value uploaded. A second expression here could not express
      # three environments -- a two-branch ternary sent the cloud secret for any
      # environment that was not staging -- and would reintroduce guard/upload drift.
      # The same GitHub secret reaches the cluster in the same run, so the two cannot
      # diverge; a mismatch would 401 every inbound message.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/email-inbound
          packageManager: pnpm
          environment: ${{ inputs.environment }}
          secrets: |
            EMAIL_INBOUND_SECRET
