name: Integration Isolation (on demand)

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime to verify
        required: true
        type: choice
        default: both
        options:
          - both
          - hermes
          - openclaw

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.runtime }} isolation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runtime == 'both' && '["hermes","openclaw"]' || format('["{0}"]', inputs.runtime)) }}
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install API test dependencies
        working-directory: api
        run: uv sync --frozen
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.5
      - name: Install k3d
        # Same CLI pin as docker/k3d/Dockerfile. The suite owns cluster creation.
        run: |
          mkdir -p "$RUNNER_TEMP/isolation-tools"
          curl --fail --location --silent --show-error \
            https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 \
            -o "$RUNNER_TEMP/isolation-tools/k3d"
          # SHA256 from the v5.8.3 release checksums.txt (linux-amd64).
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  $RUNNER_TEMP/isolation-tools/k3d" | sha256sum --check
          chmod +x "$RUNNER_TEMP/isolation-tools/k3d"
          echo "$RUNNER_TEMP/isolation-tools" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@v4
      - name: Build selected runtime image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.runtime }}-base
          file: ${{ matrix.runtime }}-base/Dockerfile
          load: true
          tags: ${{ matrix.runtime }}-base:isolation-ci
          no-cache-filters: rust-build
          cache-from: type=gha
      - name: Verify Secrets and persistent credential transitions
        env:
          SELECTED_RUNTIME: ${{ matrix.runtime }}
          HERMES_TEST_IMAGE: hermes-base:isolation-ci
          OPENCLAW_TEST_IMAGE: openclaw-base:isolation-ci
        run: make test-integration-isolation RUNTIME="$SELECTED_RUNTIME"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-${{ matrix.runtime }}
          path: .scratch/isolation-junit.xml
          if-no-files-found: ignore
