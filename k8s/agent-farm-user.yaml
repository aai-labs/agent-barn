# Cluster prerequisite for Agent Barn, applied outside helm.
#
# The agentbarn-api chart's litellm-key pre-install Job runs as the
# `agent-farm-user` ServiceAccount: it mints a LiteLLM key and writes it to the
# `litellm-api-key` Secret via the k8s API, so the SA needs create/update on
# secrets. This is a cluster-bootstrap identity (not a per-release resource), so
# it lives here rather than in the chart — applying it is idempotent and a no-op
# on clusters where it already exists, avoiding helm ownership conflicts.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-farm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-farm-user
  namespace: agent-farm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-farm-user
  namespace: agent-farm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update"]
  # Read access for the monitoring release: Prometheus service discovery and
  # kube-state-metrics run under this SA (the tenant deployer may not create
  # new RBAC, so they reuse the identity that already has namespaced read).
  # On the shared cluster the tenant chart's workspace-maintainer Role
  # already grants this — the rule below matters for local/dev clusters
  # where this file is the only grant.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-farm-user
  namespace: agent-farm
subjects:
  - kind: ServiceAccount
    name: agent-farm-user
    namespace: agent-farm
roleRef:
  kind: Role
  name: agent-farm-user
  apiGroup: rbac.authorization.k8s.io
