# Cluster prerequisite for the monitoring release, applied outside helm.
#
# kube-prometheus-stack installs Prometheus Operator CRDs and cluster-scoped
# RBAC (ClusterRoles/Bindings for the operator, kube-state-metrics and
# Grafana), plus Prometheus needs to read nodes for kubelet/cadvisor scraping.
# The deployer ServiceAccount is namespace-admin only, so a cluster admin must
# grant these cluster-scoped permissions once before the first monitoring
# deploy:
#
#   kubectl apply -f k8s/monitoring-crd-rbac.yaml
#
# Idempotent; a no-op where it already exists. The subject below is the
# deployer SA used by CI (see docs/guidelines/operations.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentfarm-monitoring-installer
rules:
  # CRD installation/upgrades (monitoring.coreos.com CRDs).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]
  # Cluster-scoped RBAC that kube-prometheus-stack creates for its components.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["*"]
  # Read access Prometheus needs for kubelet/cadvisor and service discovery;
  # granted here so the operator's own ClusterRole can be bound (a subject
  # cannot grant permissions it does not itself hold).
  - apiGroups: [""]
    resources:
      ["nodes", "nodes/metrics", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  # Admission webhook configs created by the operator's admission job.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentfarm-monitoring-installer
subjects:
  - kind: ServiceAccount
    name: agentfarm-deployer
    namespace: agent-farm
roleRef:
  kind: ClusterRole
  name: agentfarm-monitoring-installer
  apiGroup: rbac.authorization.k8s.io
