# Overrides for installing helm/monitoring into the local k3d cluster
# (docker/k3d/k3d-monitoring.sh). Deliberately small: the scrape jobs, alert rules and
# dashboards all come from the chart, so this cannot drift from what a deploy runs.
# The web-auth values are generated by the script from PROMETHEUS_PASSWORD.

# Alertmanager needs a webhook URL. This one goes nowhere, so a local alert fails
# fast instead of posting to the team's #alerts channel. Local alerts such as
# APIAbsent and LiteLLMDown are noise anyway: only the agents run in this cluster.
slackWebhookUrl: "http://127.0.0.1:9/local-dev-no-slack"

prometheus:
  server:
    global:
      external_labels:
        environment: local

grafana:
  # There is no ingress controller or certificate issuer in k3d. Reach Grafana with
  # `kubectl -n agent-farm port-forward svc/monitoring-grafana 3001:80` if needed.
  ingress:
    enabled: false
