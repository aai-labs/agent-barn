# Required by the main Compose stack through include; also used by storage-only
# operator commands. All state survives container replacement.
services:
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    env_file: ["${GARAGE_SAVED_STATE_DIR:?Run make garage-up first}/server.env"]
    ports:
      - "${GARAGE_SAVED_S3_PORT:-3900}:3900"
    volumes:
      - type: bind
        source: ${GARAGE_SAVED_STATE_DIR}/garage.toml
        target: /etc/garage.toml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GARAGE_SAVED_STATE_DIR}/rpc-secret
        target: /secrets/rpc-secret
        read_only: true
        bind: {create_host_path: false}
      - metadata:/var/lib/garage/meta
      - data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
volumes:
  metadata:
    name: ${GARAGE_SAVED_VOLUME_PREFIX:?Run make garage-up first}_metadata
  data:
    name: ${GARAGE_SAVED_VOLUME_PREFIX:?Run make garage-up first}_data
