# Required by the main Compose stack through include; also used by storage-only
# operator commands. All state survives container replacement.
services:
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    # Optional at parse time so db-only development and stop work before setup.
    # Missing bind sources still prevent an unconfigured Garage from starting.
    env_file:
      - path: ${GARAGE_SAVED_STATE_DIR:-../../.garage-unconfigured}/server.env
        required: false
    ports:
      - "${GARAGE_SAVED_S3_PORT:-3900}:3900"
    volumes:
      - type: bind
        source: ${GARAGE_SAVED_STATE_DIR:-../../.garage-unconfigured}/garage.toml
        target: /etc/garage.toml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GARAGE_SAVED_STATE_DIR:-../../.garage-unconfigured}/rpc-secret
        target: /secrets/rpc-secret
        read_only: true
        bind: {create_host_path: false}
      - metadata:/var/lib/garage/meta
      - data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
volumes:
  metadata:
    name: ${GARAGE_SAVED_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}-garage-unconfigured}_metadata
  data:
    name: ${GARAGE_SAVED_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}-garage-unconfigured}_data
