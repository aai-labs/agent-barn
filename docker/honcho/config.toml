# Local Honcho model configuration. Mirrors helm/honcho/templates/configmap.yaml:
# every model-calling module is pinned to LiteLLM, because Honcho's built-in
# defaults target each provider's own endpoint and would send the LiteLLM key
# to the wrong host.

[deriver]
# Honcho derives conclusions from a *batch* of pending messages, not from each
# one. The default gate is 512 tokens — a few short turns — which on a real
# conversation means the deriver runs constantly and records trivia like
# "operator asked where the runbooks live" alongside anything worth keeping.
# A larger window gives the model enough conversation to tell those apart, and
# costs one call where the default spends several.
#
# Latency is not free, and an earlier note here claimed it was. Recall is
# unaffected — recent turns are already in the runtime's own context window, so
# memory is what an Agent recalls in a *later* session. The Memory tab is a
# different matter: it shows derived memory, so batching is exactly what someone
# watching it waits on. That is what the age backstop below bounds.
representation_batch_work_unit_target_tokens = 4096
representation_batch_target_input_tokens = 4096
# The backstop for conversation that never reaches the token gate — which is most
# ordinary chat: a short exchange is a few dozen tokens, nowhere near 4096. This
# timer runs per session from its oldest unprocessed message, so the wait before a
# memory appears is not a fixed delay but anywhere between zero and this value,
# depending on where that session's timer already was. At the stock 1800 that made
# a new memory take up to half an hour to show in the Memory tab, unpredictably.
# Five minutes bounds it without touching the token gate, which is where the actual
# cost saving comes from.
representation_batch_max_age_seconds = 300

[deriver.model_config]
transport = "openai"
model = "openrouter/z-ai/glm-5.2"

[deriver.model_config.overrides]
base_url = "http://litellm:4000/v1"

[summary.model_config]
transport = "openai"
