apiVersion: v1
kind: Secret
metadata: {name: vikunja, namespace: mdp45-spike}
stringData:
  VIKUNJA_DATABASE_PASSWORD: spike-local-only
  VIKUNJA_SERVICE_SECRET: spike-local-only-secret
  POSTGRES_PASSWORD: spike-local-only
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: vikunja-db, namespace: mdp45-spike}
spec:
  serviceName: vikunja-db
  replicas: 1
  selector: {matchLabels: {app: vikunja-db}}
  template:
    metadata: {labels: {app: vikunja-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: vikunja}
            - {name: POSTGRES_DB, value: vikunja}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: vikunja, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: vikunja-db, namespace: mdp45-spike}
spec: {selector: {app: vikunja-db}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: vikunja, namespace: mdp45-spike}
spec:
  serviceName: vikunja
  replicas: 1
  selector: {matchLabels: {app: vikunja}}
  template:
    metadata: {labels: {app: vikunja}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: vikunja
          image: vikunja/vikunja:latest
          env:
            - {name: VIKUNJA_SERVICE_PUBLICURL, value: "http://127.0.0.1:13457/"}
            - {name: VIKUNJA_SERVICE_ENABLEREGISTRATION, value: "false"}
            - {name: VIKUNJA_DATABASE_TYPE, value: postgres}
            - {name: VIKUNJA_DATABASE_HOST, value: vikunja-db}
            - {name: VIKUNJA_DATABASE_USER, value: vikunja}
            - {name: VIKUNJA_DATABASE_DATABASE, value: vikunja}
          envFrom: [{secretRef: {name: vikunja}}]
          ports: [{containerPort: 3456}]
          readinessProbe: {httpGet: {path: /api/v1/info, port: 3456}, periodSeconds: 3}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
          volumeMounts: [{name: files, mountPath: /app/vikunja/files}]
  volumeClaimTemplates:
    - metadata: {name: files}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: vikunja, namespace: mdp45-spike}
spec: {selector: {app: vikunja}, ports: [{port: 3456}]}
