services:
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: mdp45_s3
    command: ["server", "-s3", "-s3.config=/etc/s3.json", "-dir=/data"]
    volumes: ["./s3.json:/etc/s3.json:ro"]
  s3-init:
    image: amazon/aws-cli:latest
    environment: {AWS_ACCESS_KEY_ID: spikeadmin, AWS_SECRET_ACCESS_KEY: spike-local-only, AWS_DEFAULT_REGION: us-east-1}
    entrypoint: ["sh", "-c", "for i in $(seq 1 30); do aws --endpoint-url http://s3:8333 s3 mb s3://vikunja-files && exit 0; sleep 2; done; exit 1"]
  vikunja:
    environment:
      VIKUNJA_FILES_TYPE: s3
      VIKUNJA_FILES_S3_ENDPOINT: http://s3:8333
      VIKUNJA_FILES_S3_BUCKET: vikunja-files
      VIKUNJA_FILES_S3_REGION: us-east-1
      VIKUNJA_FILES_S3_ACCESSKEY: spikeadmin
      VIKUNJA_FILES_S3_SECRETKEY: spike-local-only
      VIKUNJA_FILES_S3_USEPATHSTYLE: "true"
    depends_on:
      s3-init: {condition: service_completed_successfully}
