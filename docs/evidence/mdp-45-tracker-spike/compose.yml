name: mdp45-vikunja
services:
  db:
    image: postgres:16
    container_name: mdp45_vikunja_db
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: spike-local-only
      POSTGRES_DB: vikunja
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikunja"]
      interval: 2s
      retries: 30
  vikunja:
    image: vikunja/vikunja:latest
    container_name: mdp45_vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:13456/
      VIKUNJA_SERVICE_SECRET: spike-local-only-secret
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: spike-local-only
      VIKUNJA_DATABASE_DATABASE: vikunja
    ports: ["127.0.0.1:13456:3456"]
    volumes: ["files:/app/vikunja/files"]
    depends_on:
      db: {condition: service_healthy}
      init-files: {condition: service_completed_successfully}
  init-files:
    image: busybox:1.36
    command: ["chown", "-R", "1000:0", "/files"]
    volumes: ["files:/files"]
volumes:
  files:
