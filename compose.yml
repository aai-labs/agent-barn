services:
  db:
    image: postgres:16
    container_name: aai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - aai_db_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aai_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SECRET_SIGNING_KEY: ${SECRET_SIGNING_KEY:?SECRET_SIGNING_KEY is required}
      SUPER_USER_CREDENTIALS: ${SUPER_USER_CREDENTIALS:?SUPER_USER_CREDENTIALS is required}
      EMAIL_SERVER_CREDENTIAL: ${EMAIL_SERVER_CREDENTIAL-}
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER-}
      # Gmail "Authenticate with Google" OAuth client (optional; empty disables the flow).
      GOOGLE_CLOUD_CLIENT_ID: ${GOOGLE_CLOUD_CLIENT_ID-}
      GOOGLE_CLOUD_CLIENT_SECRET: ${GOOGLE_CLOUD_CLIENT_SECRET-}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      UI_APP_URL: ${UI_APP_URL:?UI_APP_URL is required}
      # Local k8s (k3d) dev: point this at the in-container kubeconfig to let the
      # API drive the k3d cluster. Unset by default so plain `make up` is
      # unchanged; `make cluster-up` prints the exact value to add to .env.
      K8S_KUBECONFIG_PATH: ${API_K8S_KUBECONFIG_PATH-}
      # Where agent pods push telemetry. The code default targets the in-cluster
      # Service, which only resolves when the API itself runs in k8s; here it runs
      # in Docker, so pods must come back through the host. Same value as the
      # host-run path in the Makefile — see README "Runtime telemetry".
      INGEST_BASE_URL: ${INGEST_BASE_URL:-http://host.docker.internal:${INGEST_PORT:-8001}/ingest/v1}
    extra_hosts:
      # Reach the host-published k8s API from inside the container. No-op on
      # Docker Desktop; required on Linux/CI where host.docker.internal is unset.
      - "host.docker.internal:host-gateway"
    volumes:
      # k3d writes kubeconfigs here. Directory mount is safe when absent (Docker
      # creates an empty, gitignored dir) — avoids the missing-file-becomes-a-dir
      # bind-mount trap.
      - ./.k3d:/app/.k3d:ro
    ports:
      - "${API_PORT:?API_PORT is required}:8000"
      # Ingest (api/start.sh runs it alongside the main app). Published on all
      # interfaces so agent pods inside k3d can reach it through the host — on
      # Linux host.docker.internal maps to the bridge gateway, not loopback.
      # Every request needs the agent's INGEST_API_KEY as a bearer token.
      - "${INGEST_PORT:-8001}:8001"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://api:8000
    container_name: aai_ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"

  # k3d runner — provides the k3d binary without requiring a host install.
  # Docker socket is mounted so k3d can create k3s containers as host siblings.
  # The repo root is mounted at /workspace so scripts and helm charts are accessible.
  k3d-runner:
    build:
      context: .
      dockerfile: docker/k3d/Dockerfile
    profiles: ["k3d"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    working_dir: /workspace

  # LiteLLM proxy + its Postgres — only started by `make cluster-up`.
  # Agents running inside k3d reach LiteLLM via host.docker.internal:7070.
  litellm-db:
    image: postgres:16
    container_name: aai_litellm_db
    profiles: ["k3d"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - aai_litellm_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable.patch.3
    container_name: aai_litellm
    profiles: ["k3d"]
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
    ports:
      # Bind all interfaces (not just loopback) so agent pods inside k3d can
      # reach LiteLLM through the host on Linux, where host.docker.internal maps
      # to the bridge gateway IP rather than 127.0.0.1. Safe for local dev on a
      # personal machine: the proxy is gated by LITELLM_MASTER_KEY.
      - "7070:4000"
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro

volumes:
  aai_db_postgres_data:
  aai_litellm_db_data:
