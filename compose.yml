# Local dev stack only — prod runs via Helm (see helm/, helmfile.yaml.gotmpl).
# api/worker/communications/ui run with source bind-mounted and dev servers in watch mode, so
# ./run.sh (which drives this file) gives you the same hot reload as
# `make dev-api`/`dev-ui`/`dev-worker`, just fully containerized.

x-api-env: &api-env
  # Container-network hostnames override the localhost defaults in .env.
  DB_CONNECTION_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  REDIS_URL: redis://redis:6379/0
  SECRET_SIGNING_KEY: ${SECRET_SIGNING_KEY:?SECRET_SIGNING_KEY is required}
  PLATFORM_ADMIN_CREDENTIALS: ${PLATFORM_ADMIN_CREDENTIALS:?PLATFORM_ADMIN_CREDENTIALS is required}
  ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
  UI_APP_URL: ${UI_APP_URL:?UI_APP_URL is required}

services:
  db:
    image: postgres:16
    container_name: aai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - aai_db_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aai_redis
    restart: unless-stopped
    volumes:
      - aai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aai_api
    restart: unless-stopped
    command: >
      sh -c "uvicorn api.ingest_main:app --host 0.0.0.0 --port 8001 --reload &
        exec fastapi dev api/main.py --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Pulls in everything else defined in .env (AGENT_*, LITELLM_*, OPENROUTER_*,
    # CLOUDFLARE_*, SENDER_EMAIL, GOOGLE_CLOUD_*, ...); `environment:` below overrides only the
    # values that must point at in-network container hostnames.
    env_file:
      - .env
    environment:
      <<: *api-env
      # Agent pods run in k3d, outside this Compose network, so they reach the
      # Communications gateway through the same host hop as Ingest and LiteLLM.
      COMMUNICATIONS_BASE_URL: ${COMMUNICATIONS_BASE_URL:-http://host.docker.internal:${COMMUNICATIONS_PORT:-8002}/communications/v1}
      # The rest of the agent config (AGENT_*, LITELLM_SECRET_NAME, OPENCLAW_IMAGE,
      # ...) arrives via env_file above. Only the values that must differ inside
      # the container are overridden here.
      #
      # Local k8s (k3d) dev: point this at the in-container kubeconfig to let the
      # API drive the k3d cluster. Named differently from the code's var so a
      # bare `docker compose up` (no k3d) stays unchanged. ./run.sh sets this
      # automatically; falling back to K8S_KUBECONFIG_PATH means a manually
      # assembled .env that only sets the host-facing var doesn't have it
      # silently blanked here — though that fallback value is host-facing
      # (kubeconfig-host.yaml points at 127.0.0.1, unreachable from inside
      # this container), so it'll fail loudly on a real connection attempt
      # rather than pointing at the right cluster; set API_K8S_KUBECONFIG_PATH
      # explicitly (/app/.k3d/kubeconfig-internal.yaml) for that to work.
      K8S_KUBECONFIG_PATH: ${API_K8S_KUBECONFIG_PATH:-${K8S_KUBECONFIG_PATH-}}
      # Where agent pods push telemetry. The code default targets the in-cluster
      # Service, which only resolves when the API itself runs in k8s; here it runs
      # in Docker, so pods must come back through the host. Same value as the
      # host-run path in the Makefile — see README "Runtime telemetry".
      INGEST_BASE_URL: ${INGEST_BASE_URL:-http://host.docker.internal:${INGEST_PORT:-8001}/ingest/v1}
      # The API mints per-agent LiteLLM keys over the compose network. .env's
      # LITELLM_BASE_URL is host-facing (127.0.0.1) and env_file would pull it in
      # verbatim, where it resolves to this container instead of the proxy.
      LITELLM_BASE_URL: ${API_LITELLM_BASE_URL:-http://litellm:4000}
    extra_hosts:
      # Reach the host-published k8s API from inside the container. No-op on
      # Docker Desktop; required on Linux/CI where host.docker.internal is unset.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app/api
      # k3d writes kubeconfigs here. Directory mount is safe when absent (Docker
      # creates an empty, gitignored dir) — avoids the missing-file-becomes-a-dir
      # bind-mount trap.
      - ./.k3d:/app/.k3d:ro
    ports:
      - "${API_PORT:?API_PORT is required}:8000"
      # Ingest, run by the api command above. Published on all interfaces so agent
      # pods inside k3d can reach it through the host — on Linux
      # host.docker.internal maps to the bridge gateway, not loopback. Every
      # request needs the agent's INGEST_API_KEY as a bearer token.
      - "${INGEST_PORT:-8001}:8001"

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aai_worker
    restart: unless-stopped
    command: ["dramatiq", "api.worker_app", "--processes", "1", "--threads", "4", "--watch", "/app/api"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *api-env
    volumes:
      - ./api:/app/api

  communications:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aai_communications
    restart: unless-stopped
    command: ["uvicorn", "api.communications_main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *api-env
    volumes:
      - ./api:/app/api
    ports:
      - "${COMMUNICATIONS_PORT:-8002}:8002"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: deps
    container_name: aai_ui
    restart: unless-stopped
    command: sh -c "pnpm install && pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://api:8000
      # Non-interactive: without this, pnpm prompts before pruning node_modules
      # when the lockfile changes, which hangs forever with no TTY in the container.
      CI: "true"
    volumes:
      - ./ui:/app
      - aai_ui_node_modules:/app/node_modules
    ports:
      - "${UI_PORT:-3000}:3000"

  # k3d runner — provides the k3d binary without requiring a host install.
  # Docker socket is mounted so k3d can create k3s containers as host siblings.
  # The repo root is mounted at /workspace so scripts and helm charts are accessible.
  k3d-runner:
    build:
      context: .
      dockerfile: docker/k3d/Dockerfile
    profiles: ["k3d"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    working_dir: /workspace

  # LiteLLM proxy + its Postgres — only started by ./run.sh (or `bash docker/k3d/k3d-up.sh`).
  # Agents running inside k3d reach LiteLLM via host.docker.internal:7070.
  litellm-db:
    image: postgres:16
    container_name: ${LITELLM_DB_CONTAINER_NAME:-aai_litellm_db}
    profiles: ["k3d"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      # postgres:16 declares VOLUME /var/lib/postgresql/data (PGDATA), not the
      # parent — mounting the parent here left PGDATA an anonymous volume that
      # `docker compose down -v`/`docker volume prune` drops silently, wiping
      # every LiteLLM virtual key even though the named volume looked intact.
      - aai_litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:v1.96.2
    container_name: ${LITELLM_CONTAINER_NAME:-aai_litellm}
    profiles: ["k3d"]
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
    ports:
      # Bind all interfaces (not just loopback) so agent pods inside k3d can
      # reach LiteLLM through the host on Linux, where host.docker.internal maps
      # to the bridge gateway IP rather than 127.0.0.1. Safe for local dev on a
      # personal machine: the proxy is gated by LITELLM_MASTER_KEY.
      - "${LITELLM_PORT:-7070}:4000"
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro

volumes:
  aai_db_postgres_data:
  aai_litellm_db_data:
  aai_redis_data:
  aai_ui_node_modules:
