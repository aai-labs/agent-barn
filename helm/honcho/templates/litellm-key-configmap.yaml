{{- if not .Values.litellmKey }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-litellm-key-script
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  generate_key.py: |
    #!/usr/bin/env python3
    """Mint Honcho's LiteLLM key and publish it to a Secret.

    Honcho sends every model call on one service credential, so this key is what
    its spend is attributed against. It is written under two names in a single
    Secret: `LLM_OPENAI_API_KEY`, which Honcho itself reads, and
    `HONCHO_LITELLM_KEY`, which the API hashes to match the key's spend in
    LiteLLM's activity report. One value, one place, two consumers.
    """
    import base64
    import json
    import os
    import ssl
    import time
    import urllib.error
    import urllib.request

    LITELLM_URL = {{ .Values.keyJob.litellmUrl | quote }}
    MASTER_KEY = os.environ["LITELLM_MASTER_KEY"]
    SECRET_NAME = {{ .Values.keyJob.secretName | quote }}
    KEY_ALIAS = {{ .Values.keyJob.keyAlias | quote }}
    LITELLM_HEADERS = {
        "Authorization": f"Bearer {MASTER_KEY}",
        "Content-Type": "application/json",
    }

    print("Waiting for LiteLLM to accept connections...", flush=True)
    for i in range(18):
        try:
            urllib.request.urlopen(
                f"{LITELLM_URL}/health/readiness", timeout=10
            ).read()
            print("LiteLLM is ready", flush=True)
            break
        except Exception as e:
            print(f"  attempt {i + 1}/18: {e}", flush=True)
            time.sleep(10)
    else:
        raise SystemExit("LiteLLM did not become ready after 3 minutes")

    # Delete any existing key with our alias so re-runs of this Job succeed
    # (LiteLLM requires unique aliases across all keys). Honcho reads its key
    # from the Secret at pod start, and the Job is a pre-upgrade hook, so the
    # replacement is published before any pod restarts onto it.
    try:
        urllib.request.urlopen(urllib.request.Request(
            f"{LITELLM_URL}/key/delete",
            data=json.dumps({"key_aliases": [KEY_ALIAS]}).encode(),
            headers=LITELLM_HEADERS,
            method="POST",
        ), timeout=10).read()
        print(f"Deleted any existing key with alias '{KEY_ALIAS}'", flush=True)
    except urllib.error.HTTPError as e:
        if e.code not in (400, 404):
            raise
        print(f"No existing key to delete (HTTP {e.code})", flush=True)

    resp = urllib.request.urlopen(urllib.request.Request(
        f"{LITELLM_URL}/key/generate",
        data=json.dumps({"duration": None, "key_alias": KEY_ALIAS}).encode(),
        headers=LITELLM_HEADERS,
        method="POST",
    ), timeout=10)
    api_key = json.loads(resp.read())["key"]
    print("Key generated successfully", flush=True)

    sa_token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    namespace = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace").read().strip()
    ctx = ssl.create_default_context(
        cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    )

    encoded = base64.b64encode(api_key.encode()).decode()
    secret_body = json.dumps({
        "apiVersion": "v1",
        "kind": "Secret",
        "metadata": {"name": SECRET_NAME, "namespace": namespace},
        "data": {"LLM_OPENAI_API_KEY": encoded, "HONCHO_LITELLM_KEY": encoded},
    }).encode()

    headers = {
        "Authorization": f"Bearer {sa_token}",
        "Content-Type": "application/json",
    }
    apiserver = "https://kubernetes.default.svc"

    try:
        req = urllib.request.Request(
            f"{apiserver}/api/v1/namespaces/{namespace}/secrets",
            data=secret_body,
            headers=headers,
            method="POST",
        )
        urllib.request.urlopen(req, context=ctx)
        print(f"Secret '{SECRET_NAME}' created", flush=True)
    except urllib.error.HTTPError as e:
        if e.code == 409:
            req = urllib.request.Request(
                f"{apiserver}/api/v1/namespaces/{namespace}/secrets/{SECRET_NAME}",
                data=secret_body,
                headers=headers,
                method="PUT",
            )
            urllib.request.urlopen(req, context=ctx)
            print(f"Secret '{SECRET_NAME}' updated", flush=True)
        else:
            raise
{{- end }}
