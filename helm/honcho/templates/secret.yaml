apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_CONNECTION_URI: {{ .Values.databaseUrl | required "databaseUrl is required" | quote }}
{{- if .Values.litellmKey }}
  # Pinned explicitly. With this unset the key-minting Job publishes it to
  # `keyJob.secretName` instead, and the deployments read it from there — it is
  # never in two Secrets at once, so there is no question of which one wins.
  LLM_OPENAI_API_KEY: {{ .Values.litellmKey | quote }}
{{- end }}
{{- if and .Values.telemetry.enabled .Values.telemetry.key }}
  TELEMETRY_HEADERS: {{ printf "{\"Authorization\":\"Bearer %s\"}" .Values.telemetry.key | quote }}
{{- end }}
