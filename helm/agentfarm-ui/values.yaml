image:
  repository: registry.k8s.aai-labs.com/agentfarm-ui
  tag: latest
  pullPolicy: Always

replicaCount: 1

imagePullSecrets:
  - name: registry-pull-secret

service:
  port: 3000

ingress:
  host: agent-farm.k8s.aai-labs.com
  clusterIssuer: letsencrypt-http01
  tlsSecretName: agentfarm-ui-tls

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
