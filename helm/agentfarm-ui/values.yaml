registryPrefix: "registry.k8s.aai-labs.com"

image:
  repository: agentfarm-ui
  tag: latest
  pullPolicy: Always

# Stamped onto the pod template as an annotation so a deploy under a moving
# tag (e.g. `latest`) still produces a manifest diff and rolls the pods —
# without this, Helm sees an unchanged image string and skips the rollout,
# leaving the old code running despite a new image being pushed.
buildSha: ""

replicaCount: 1

imagePullSecrets:
  - name: registry-pull-secret

service:
  port: 3000

ingress:
  hosts: "agent-farm.k8s.aai-labs.com"
  clusterIssuer: letsencrypt-http01
  tlsSecretName: agentfarm-ui-tls

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
