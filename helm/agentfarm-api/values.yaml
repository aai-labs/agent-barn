registryPrefix: "registry.k8s.aai-labs.com"

image:
  repository: agentfarm-api
  pullPolicy: Always

openclawImage:
  repository: agentfarm-openclaw-base
  tag: latest

hermesImage:
  repository: agentfarm-hermes-base
  tag: latest

replicaCount: 1

# k8s Secret: DB_CONNECTION_URL, SECRET_SIGNING_KEY,
# SUPER_USER_CREDENTIALS, ENVIRONMENT, WEB_APP_URL
secretName: agentfarm-api

dbConnectionUrl: ""
secretSigningKey: ""
superUserCredentials: ""
superUserFullName: "Super User"
agentTokenEncryptionKey: ""
environment: ""
webAppUrl: ""

# Transactional email (invites, password reset, verification). Leave blank to disable
# email delivery — the app logs a warning and no-ops sends. Both credential and SMTP
# server must be set for delivery to be enabled.
emailServerCredential: ""
emailSmtpServer: ""
emailFromAddress: ""

# Shared Google OAuth 2.0 "Web application" client for the Gmail "Authenticate with
# Google" flow. Leave blank to disable the flow. Registered redirect URI must be
# "<webAppUrl>/api/v1/integrations/google/callback".
googleCloudClientId: ""
googleCloudClientSecret: ""

litellmBaseUrl: "http://litellm:4000"
agentLitellmBaseUrl: "http://litellm:4000"

# Firecrawl — self-hosted web scraping service used by both agent runtimes.
# The base URL points at the firecrawl ClusterIP service; the API key is the
# platform-level key shared by all agents (users can override per-agent via UI).
agentFirecrawlBaseUrl: "http://firecrawl:3002"
agentFirecrawlApiKey: ""

# Comma-separated fnmatch globs limiting which OpenRouter models the picker
# offers, e.g. "z-ai/glm-5.2,openai/gpt-5*". Empty offers the full catalogue.
agentModelAllowlist: ""

# Default model preselected in the picker and used at runtime when an agent has
# no model set. Format: litellm/openrouter/<slug>. Empty uses the code default.
agentDefaultModel: ""

kubeconfigB64: ""
agentImagePullSecret: "registry-pull-secret"

# StorageClass for agent pod PVCs. Empty falls through to the cluster default.
storageClass: ""

registry:
  server: ""
  username: ""
  password: ""

# Secret written by the pre-install hook Job: LITELLM_API_KEY
litellmApiKeySecretName: litellm-api-key

# Pre-existing litellm Secret (used by hook Job to call /key/generate)
litellmSecretName: litellm

#  kubeconfig Secret for managing agent k8s resources
kubeconfigSecretName: agent-farm-user-kubeconfig

imagePullSecrets:
  - name: registry-pull-secret

service:
  port: 8000
  ingestPort: 8001

apiExternalUrl: "https://api.agent-farm.k8s.aai-labs.com"

ingress:
  hosts: "api.agent-farm.k8s.aai-labs.com"
  clusterIssuer: letsencrypt-http01
  tlsSecretName: agentfarm-api-tls

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
