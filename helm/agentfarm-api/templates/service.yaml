apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfarm-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
    - name: ingest
      port: {{ .Values.service.ingestPort }}
      targetPort: {{ .Values.service.ingestPort }}
  selector:
    {{- include "agentfarm-api.selectorLabels" . | nindent 4 }}
