apiVersion: v1
kind: Secret
metadata:
  name: registry-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfarm-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"{{ .Values.registry.server | required "registry.server is required" }}":{"username":"{{ .Values.registry.username | required "registry.username is required" }}","password":"{{ .Values.registry.password | required "registry.password is required" }}","auth":"{{ printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc }}"}}}