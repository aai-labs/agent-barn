apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-farm-user
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfarm-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-farm-secret-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfarm-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-farm-secret-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfarm-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: agent-farm-user
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: agent-farm-secret-writer
  apiGroup: rbac.authorization.k8s.io