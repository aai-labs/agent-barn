apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfarm-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentfarm-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when secret-sourced env (envFrom) changes; a Secret update
        # alone does not alter the pod template. Inline env vars already roll on change.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "agentfarm-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
            - secretRef:
                name: {{ .Values.litellmApiKeySecretName }}
          env:
            - name: K8S_KUBECONFIG_PATH
              value: /etc/kubeconfig/kubeconfig
            - name: OPENCLAW_IMAGE
              value: "{{ .Values.registryPrefix }}/{{ .Values.openclawImage.repository }}:{{ .Values.openclawImage.tag }}"
            - name: HERMES_IMAGE
              value: "{{ .Values.registryPrefix }}/{{ .Values.hermesImage.repository }}:{{ .Values.hermesImage.tag }}"
            - name: API_EXTERNAL_URL
              value: "{{ .Values.apiExternalUrl }}"
            - name: LITELLM_BASE_URL
              value: "{{ .Values.litellmBaseUrl }}"
            - name: AGENT_LITELLM_BASE_URL
              value: "{{ .Values.agentLitellmBaseUrl }}"
            - name: AGENT_IMAGE_PULL_SECRET
              value: "{{ .Values.agentImagePullSecret }}"
            - name: AGENT_MODEL_ALLOWLIST
              value: "{{ .Values.agentModelAllowlist }}"
            {{- if .Values.agentDefaultModel }}
            - name: AGENT_DEFAULT_MODEL
              value: "{{ .Values.agentDefaultModel }}"
            {{- end }}
            {{- if .Values.storageClass }}
            - name: STORAGE_CLASS
              value: "{{ .Values.storageClass }}"
            {{- end }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubeconfigSecretName }}
