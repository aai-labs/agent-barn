apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  HINDSIGHT_API_DATABASE_URL: {{ required "databaseUrl is required" .Values.databaseUrl | quote }}
  HINDSIGHT_API_TENANT_API_KEY: {{ required "apiKey is required" .Values.apiKey | quote }}
  HINDSIGHT_API_LLM_API_KEY: {{ required "llm.apiKey is required" .Values.llm.apiKey | quote }}
