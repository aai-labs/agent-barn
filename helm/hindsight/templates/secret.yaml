{{- $runtimeKey := required "runtimeServiceKey is required" .Values.runtimeServiceKey }}
{{- if eq $runtimeKey .Values.apiKey }}
{{- fail "runtimeServiceKey must differ from Hindsight apiKey" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  HINDSIGHT_API_DATABASE_URL: {{ required "databaseUrl is required" .Values.databaseUrl | quote }}
  HINDSIGHT_API_TENANT_API_KEY: {{ required "apiKey is required" .Values.apiKey | quote }}
  AGENTBARN_MEMORY_SETTINGS_KEY: {{ $runtimeKey | quote }}
