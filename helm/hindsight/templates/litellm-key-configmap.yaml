apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-litellm-key-script
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  generate_key.py: |
{{ .Files.Get "files/generate_key.py" | indent 4 }}
