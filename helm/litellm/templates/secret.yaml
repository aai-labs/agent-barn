apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.masterKey | required "masterKey is required" }}
  OPENROUTER_API_KEY: {{ .Values.openrouterApiKey | required "openrouterApiKey is required" }}
  DATABASE_URL: {{ .Values.databaseUrl | required "databaseUrl is required" }}