image:
  repository: ghcr.io/berriai/litellm
  tag: v1.96.2
  pullPolicy: IfNotPresent

replicaCount: 1

# Name of the k8s Secret containing:
#   LITELLM_MASTER_KEY, OPENROUTER_API_KEY, DATABASE_URL
secretName: litellm

# Name of the k8s Secret containing LITELLM_SALT_KEY. Kept apart from
# secretName because the API reads that Secret and must never see the salt.
saltSecretName: litellm-salt

masterKey: ""
# Encrypts the provider keys LiteLLM stores in its database. Set once and never
# change it: stored routes cannot be decrypted under a different value.
saltKey: ""
openrouterApiKey: ""
databaseUrl: ""

service:
  port: 4000

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 2Gi
    cpu: 1000m