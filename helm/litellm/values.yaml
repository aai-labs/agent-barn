image:
  repository: ghcr.io/berriai/litellm
  tag: v1.96.2
  pullPolicy: IfNotPresent

replicaCount: 1

# Name of the k8s Secret containing:
#   LITELLM_MASTER_KEY, OPENROUTER_API_KEY, DATABASE_URL
secretName: litellm

masterKey: ""
openrouterApiKey: ""
databaseUrl: ""

# Embedding model exposed for Honcho. OpenRouter's embeddings endpoint is not in
# its /models catalogue, so this is named explicitly rather than reached through
# the wildcard passthrough. 1536 dimensions matches what Honcho's vector store is
# fixed at, and that dimension cannot be changed once memory exists.
embeddingModel: "openai/text-embedding-3-small"

service:
  port: 4000

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 2Gi
    cpu: 1000m