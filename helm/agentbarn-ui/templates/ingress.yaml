apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-ui.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        {{- range splitList "," .Values.ingress.hosts }}
        - {{ . | trim }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- /*
  Browser API calls go to the same origin (/api), so the refresh cookie stays
  first-party and no CORS is needed. Route them straight to the API Service
  rather than through the Next server's rewrite, which costs a hop through this
  pod and a second Traefik pass per call. Prefix /api wins over / (longest
  match). The Next rewrite stays as the fallback for local dev and installs
  without this ingress.
  */}}
  rules:
    {{- range splitList "," .Values.ingress.hosts }}
    - host: {{ . | trim }}
      http:
        paths:
          {{- with $.Values.apiBackend }}
          {{- if .serviceName }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .port }}
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
