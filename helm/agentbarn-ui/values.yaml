registryPrefix: "registry.k8s.aai-labs.com"

image:
  repository: agentbarn-ui
  tag: latest
  pullPolicy: Always

# Stamped onto the pod template as an annotation so a deploy under a moving
# tag (e.g. `latest`) still produces a manifest diff and rolls the pods —
# without this, Helm sees an unchanged image string and skips the rollout,
# leaving the old code running despite a new image being pushed.
buildSha: ""

replicaCount: 1

imagePullSecrets:
  - name: registry-pull-secret

service:
  port: 3000

# The API Service that the ingress sends /api to directly. It must live in
# the same namespace as this release. Set serviceName to "" to send /api
# through the Next server's rewrite instead.
apiBackend:
  serviceName: agentbarn-api
  port: 8000

ingress:
  hosts: "agent-farm.k8s.aai-labs.com"
  clusterIssuer: letsencrypt-http01
  tlsSecretName: agentbarn-ui-tls

# CPU is what the UI runs short of: every dashboard page load prefetches its links, 40+
# requests at once, and a quarter core left the pod throttled in every period while it
# served them, so a click's own request queued behind them. A full core lets it burst
# through a page load. Memory use sits well under the limit; the namespace quota binds on
# memory, so it stays as it is.
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 1000m
