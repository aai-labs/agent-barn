apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email | required "email is required" }}
    privateKeySecretRef:
      name: {{ .Values.name }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClassName }}