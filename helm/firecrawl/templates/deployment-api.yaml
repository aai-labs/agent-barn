apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecrawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "firecrawl.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "firecrawl.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: firecrawl
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node"]
          args: ["dist/src/harness.js", "--start-docker"]
          ports:
            - name: http
              containerPort: {{ .Values.service.apiPort }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - name: PORT
              value: "{{ .Values.service.apiPort }}"
            - name: HOST
              value: "0.0.0.0"
            - name: NUM_WORKERS_PER_QUEUE
              value: "8"
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis:{{ .Values.service.redisPort }}"
            - name: REDIS_RATE_LIMIT_URL
              value: "redis://{{ .Release.Name }}-redis:{{ .Values.service.redisPort }}"
            - name: PLAYWRIGHT_MICROSERVICE_URL
              value: "http://{{ .Release.Name }}-playwright:{{ .Values.service.playwrightPort }}/scrape"
            - name: USE_DB_AUTHENTICATION
              value: "true"
            - name: NUQ_RABBITMQ_URL
              value: "amqp://{{ .Release.Name }}-rabbitmq:{{ .Values.service.rabbitmqPort }}"
            - name: POSTGRES_HOST
              value: "{{ .Values.postgres.host }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.postgres.port }}"
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.apiPort }}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.apiPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
