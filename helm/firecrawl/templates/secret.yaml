apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecrawl.labels" . | nindent 4 }}
type: Opaque
stringData:
  TEST_API_KEY: {{ .Values.testApiKey | required "testApiKey is required" | quote }}
  BULL_AUTH_KEY: {{ .Values.bullAuthKey | required "bullAuthKey is required" | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | required "postgres.user is required" | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | required "postgres.password is required" | quote }}
  POSTGRES_DB: {{ .Values.postgres.db | required "postgres.db is required" | quote }}
