apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecrawl.labels" . | nindent 4 }}
type: Opaque
stringData:
  FIRECRAWL_API_KEY: {{ .Values.firecrawlApiKey | required "firecrawlApiKey is required" | quote }}
  BULL_AUTH_KEY: {{ .Values.bullAuthKey | required "bullAuthKey is required" | quote }}
  DATABASE_URL: {{ .Values.databaseUrl | required "databaseUrl is required" | quote }}
