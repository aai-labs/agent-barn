# Provisions the read-only LiteLLM key Prometheus scrapes /metrics with
# (files/litellm_metrics_key.py). Runs before the Prometheus server rolls so
# the mounted Secret exists; the litellm release is already up (helmfile
# needs: agentbarn-api -> litellm).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-litellm-metrics-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "monitoring.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litellm-metrics-key-job
    spec:
      # Writes the Secret through the Kubernetes API, so it needs the tenant
      # SA (the chart renders no RBAC of its own).
      serviceAccountName: {{ .Values.litellmMetricsKey.serviceAccountName }}
      automountServiceAccountToken: true
      restartPolicy: Never
      containers:
        - name: provision-key
          image: {{ .Values.litellmMetricsKey.image }}
          command: ["python3", "/scripts/litellm_metrics_key.py"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellmMetricsKey.litellmSecretName }}
                  key: LITELLM_MASTER_KEY
            - name: SECRET_NAME
              value: {{ .Values.litellmMetricsKey.secretName | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-litellm-metrics-key-script
