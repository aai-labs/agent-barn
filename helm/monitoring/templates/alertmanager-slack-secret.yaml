apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
type: Opaque
data:
  # Mounted into Alertmanager and referenced via slack_api_url_file, so the
  # webhook never appears in the rendered Alertmanager ConfigMap.
  slack-webhook-url: {{ .Values.slackWebhookUrl | b64enc | quote }}
