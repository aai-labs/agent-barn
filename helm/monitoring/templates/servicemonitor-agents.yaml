apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agents
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  # One Service per agent is created dynamically by the API; all of them
  # carry the stable component label (builders/common.py::_labels).
  selector:
    matchLabels:
      agentfarm.io/component: agent
  # job="agent" for every target (the value of the component label);
  # app/agent-name/org-id/org-name identify the agent and its organization
  # (dashes sanitize to underscores: agent_name, org_id, org_name). All of
  # them come from the Service, so they stay stable across pod generations.
  jobLabel: agentfarm.io/component
  targetLabels:
    - app
    - agent-name
    - org-id
    - org-name
  endpoints:
    - port: healthz
      path: /metrics
      interval: 30s
