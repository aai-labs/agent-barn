{{- /*
Basic auth for the Prometheus server and Alertmanager web endpoints: agent
pods share this namespace (and the tenant's allow-intra-namespace
NetworkPolicy lets every pod reach every pod), so both servers must not be
open. web-config.yml (bcrypt) is read by the servers via --web.config.file;
password is read by in-cluster clients (Prometheus self-scrape and alert
delivery via password_file, Grafana via env).

The subcharts' probes and Prometheus's config reloader only take literal
values, so helmfile derives those from the same password; they are checked
here so a mismatch fails the render instead of crash-looping the pods.
*/ -}}
{{- $pw := required "webAuth.password is required (helmfile sets it from MONITORING_WEB_PASSWORD)" .Values.webAuth.password -}}
{{- if not (regexMatch "^[A-Za-z0-9]{12,}$" $pw) -}}
{{- fail "webAuth.password must be at least 12 alphanumeric characters (it is embedded in the config reloader URL)" -}}
{{- end -}}
{{- $user := .Values.webAuth.username -}}
{{- $basic := printf "Basic %s" (printf "%s:%s" $user $pw | b64enc) -}}
{{- $headers := dict -}}
{{- range .Values.prometheus.server.probeHeaders }}{{ $_ := set $headers .name .value }}{{ end -}}
{{- if ne (get $headers "Authorization") $basic -}}
{{- fail "prometheus.server.probeHeaders must carry the Authorization header for webAuth (see helmfile.yaml.gotmpl)" -}}
{{- end -}}
{{- if ne .Values.prometheus.configmapReload.reloadUrl (printf "http://%s:%s@127.0.0.1:9090/-/reload" $user $pw) -}}
{{- fail "prometheus.configmapReload.reloadUrl must authenticate with webAuth (see helmfile.yaml.gotmpl)" -}}
{{- end -}}
{{- range $probe := list "livenessProbe" "readinessProbe" -}}
{{- $amHeaders := dict -}}
{{- range (get (get (get $.Values.prometheus.alertmanager $probe) "httpGet") "httpHeaders") }}{{ $_ := set $amHeaders .name .value }}{{ end -}}
{{- if ne (get $amHeaders "Authorization") $basic -}}
{{- fail (printf "prometheus.alertmanager.%s.httpGet.httpHeaders must carry the Authorization header for webAuth (see helmfile.yaml.gotmpl)" $probe) -}}
{{- end -}}
{{- end -}}
{{- /* Grafana reads the password only at startup, so its pod template must
     change with it: a rotation then restarts Grafana with the new one. */ -}}
{{- if ne (get .Values.grafana.podAnnotations "checksum/web-auth") (sha256sum $pw) -}}
{{- fail "grafana.podAnnotations.checksum/web-auth must be the sha256 of webAuth.password (see helmfile.yaml.gotmpl)" -}}
{{- end -}}
{{- /* Keep the existing hash while the password is unchanged: bcrypt salts
     randomly, so re-hashing would rewrite the Secret on every upgrade. */ -}}
{{- $webConfig := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.webAuth.secretName -}}
{{- if and $existing (eq (index $existing.data "password" | default "" | b64dec) $pw) -}}
{{- $webConfig = index $existing.data "web-config.yml" | b64dec -}}
{{- else -}}
{{- $webConfig = dict "basic_auth_users" (dict $user (bcrypt $pw)) | toYaml -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.webAuth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
type: Opaque
data:
  web-config.yml: {{ $webConfig | b64enc | quote }}
  password: {{ $pw | b64enc | quote }}
