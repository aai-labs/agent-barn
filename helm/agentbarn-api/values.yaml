registryPrefix: "registry.k8s.aai-labs.com"

image:
  repository: agentbarn-api
  tag: latest
  pullPolicy: Always

# Stamped onto the pod templates (api + worker) as an annotation so a deploy
# under a moving tag (e.g. `latest`) still produces a manifest diff and rolls
# the pods — without this, Helm sees an unchanged image string and skips the
# rollout, leaving the old code running despite a new image being pushed.
buildSha: ""

openclawImage:
  repository: agentbarn-openclaw-base
  tag: latest

hermesImage:
  repository: agentbarn-hermes-base
  tag: latest

replicaCount: 1

# k8s Secret: DB_CONNECTION_URL, SECRET_SIGNING_KEY,
# PLATFORM_ADMIN_CREDENTIALS, ENVIRONMENT, WEB_APP_URL
secretName: agentbarn-api

dbConnectionUrl: ""
secretSigningKey: ""
platformAdminCredentials: ""
platformAdminFullName: "Super User"
agentTokenEncryptionKey: ""
environment: ""
webAppUrl: ""

# Transactional email (invites, password reset, verification) via Cloudflare Email
# Sending. Leave blank to disable email delivery — the app logs a warning and no-ops
# sends. All three must be set for delivery to be enabled. senderEmail's domain must be
# onboarded and Verified for Email Sending in the Cloudflare account, and each environment
# sends from its own `mail.`-style subdomain (e.g. noreply@mail.agentbarn.dev).
cloudflareAccountId: ""
cloudflareApiToken: ""
senderEmail: ""

# Shared Google OAuth 2.0 "Web application" client for the Gmail "Authenticate with
# Google" flow. Leave blank to disable the flow. Registered redirect URI must be
# "<webAppUrl>/api/v1/integrations/google/callback".
googleCloudClientId: ""
googleCloudClientSecret: ""

# OpenRouter inference key (k8s Secret env var OPENROUTER_API_KEY), polled
# via GET /key for the key's remaining credit limit metric. Same key litellm
# uses; leave blank to skip the poll. The gauge reads +Inf until a credit
# limit is set on the key at openrouter.ai.
openrouterApiKey: ""

litellmBaseUrl: "http://litellm:4000"
agentLitellmBaseUrl: "http://litellm:4000"

# Firecrawl — self-hosted web scraping service used by both agent runtimes.
# The base URL points at the firecrawl ClusterIP service; the API key is the
# platform-level key shared by all agents (users can override per-agent via UI).
agentFirecrawlBaseUrl: "http://firecrawl:3002"
agentFirecrawlApiKey: ""

# Comma-separated fnmatch globs limiting which OpenRouter models the picker
# offers, e.g. "z-ai/glm-5.2,openai/gpt-5*". Empty offers the full catalogue.
agentModelAllowlist: ""

# Default model preselected in the picker and used at runtime when an agent has
# no model set. Format: litellm/openrouter/<slug>. Empty uses the code default.
agentDefaultModel: ""

kubeconfigB64: ""
# Name of the registry pull Secret this chart creates (registry-secret.yaml) and
# that agent pods reference to pull their own images. Must match imagePullSecrets
# below. When a release of this chart coexists with another release in the same
# namespace (e.g. during a rename cutover), override both to a release-distinct
# name — Helm refuses to let one release adopt a Secret another release owns.
agentImagePullSecret: "registry-pull-secret"

# StorageClass for agent pod PVCs. Empty falls through to the cluster default.
storageClass: ""

registry:
  server: ""
  username: ""
  password: ""

# Secret written by the pre-install hook Job: LITELLM_API_KEY
litellmApiKeySecretName: litellm-api-key

# Pre-existing litellm Secret (used by hook Job to call /key/generate)
litellmSecretName: litellm

# ServiceAccount the litellm-key hook Job runs as (needs create/update on secrets).
# Defaults to the out-of-band `agent-farm-user` (see k8s/agent-farm-user.yaml). Set
# to the deploy identity's own SA when that SA already has secret perms and you can't
# provision the agent-farm-user Role/RoleBinding (e.g. a namespace-scoped kubeconfig).
litellmKeyServiceAccountName: agent-farm-user

# kubeconfig Secret for managing agent k8s resources. Empty defaults to
# "<release-name>-kubeconfig" so this release's Secret never collides with
# another release's Secret of the same name (Helm refuses to let one release
# adopt an object another release already owns).
kubeconfigSecretName: ""

imagePullSecrets:
  - name: registry-pull-secret

service:
  port: 8000
  ingestPort: 8001

apiExternalUrl: "https://api.agent-farm.k8s.aai-labs.com"

ingress:
  hosts: "api.agent-farm.k8s.aai-labs.com"
  clusterIssuer: letsencrypt-http01
  tlsSecretName: agentbarn-api-tls

# Shared Redis instance (helm/redis release), not deployed by this chart.
# Used by the general-purpose worker's dramatiq broker, not just event delivery.
redisUrl: "redis://redis:6379/0"

eventDelivery:
  reconciliation:
    enabled: true
    schedule: "*/5 * * * *"

worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 1000m

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
