apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-litellm-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "agentbarn-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litellm-key-job
    spec:
      serviceAccountName: {{ .Values.litellmKeyServiceAccountName | default "agent-farm-user" }}
      automountServiceAccountToken: true
      restartPolicy: Never
      containers:
        - name: generate-key
          image: python:3.12-alpine
          command: ["python3", "/scripts/generate_key.py"]
          envFrom:
            - secretRef:
                name: {{ .Values.litellmSecretName }}
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-litellm-key-script
