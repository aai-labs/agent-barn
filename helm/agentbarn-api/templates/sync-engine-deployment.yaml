{{- if .Values.syncEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sync-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-engine
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  replicas: {{ .Values.syncEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentbarn-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sync-engine
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        build-sha: {{ .Values.buildSha | quote }}
      labels:
        {{- include "agentbarn-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sync-engine
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: sync-engine
          image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - "from api.sync_engine_main import main; main()"
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/sync-engine-heartbeat') < {{ .Values.syncEngine.heartbeatMaxAgeSeconds }} else 1)"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.syncEngine.resources | nindent 12 }}
{{- end }}
