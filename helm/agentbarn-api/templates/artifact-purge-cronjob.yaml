{{- if .Values.artifacts.purgeEnabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-artifact-purge
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: artifact-purge
              image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "api.domains.artifacts.maintenance"]
              envFrom:
                - secretRef:
                    name: {{ .Values.secretName }}
                - secretRef:
                    name: {{ .Values.artifacts.existingSecret | required "artifacts.existingSecret is required when purge is enabled" }}
              resources:
                {{- toYaml .Values.worker.resources | nindent 16 }}
{{- end }}
