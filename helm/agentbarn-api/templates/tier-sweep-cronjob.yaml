{{- if .Values.tierSweep.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-tier-sweep
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: tier-sweep
spec:
  # Ends subscription periods that have run out and applies Tier Holds whose choosing
  # time is up (docs/features/tiers.md).
  schedule: {{ .Values.tierSweep.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "agentbarn-api.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: tier-sweep
        spec:
          restartPolicy: OnFailure
          # Like the cost sync, this job talks to the Kubernetes API: holding an Agent
          # stops it, and a credit grant pushes the new limit to LiteLLM with the master
          # key read from the `litellm` Secret.
          serviceAccountName: {{ .Release.Name }}
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: tier-sweep
              image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Not `python -m`, for the reason the cost sync job gives.
              command:
                - python
                - -c
                - "from api.domains.subscriptions.sweep import main; main()"
              envFrom:
                - secretRef:
                    name: {{ .Values.secretName }}
              env:
                - name: K8S_NAMESPACE
                  value: {{ .Release.Namespace }}
                - name: K8S_KUBECONFIG_PATH
                  value: /etc/kubeconfig/kubeconfig
                # Not in the Secret — the Deployment sets it from values too.
                - name: LITELLM_BASE_URL
                  value: "{{ .Values.litellmBaseUrl }}"
              volumeMounts:
                - name: kubeconfig
                  mountPath: /etc/kubeconfig
                  readOnly: true
              resources:
                {{- toYaml .Values.worker.resources | nindent 16 }}
          volumes:
            - name: kubeconfig
              secret:
                secretName: {{ .Values.kubeconfigSecretName | default (printf "%s-kubeconfig" .Release.Name) }}
{{- end }}
