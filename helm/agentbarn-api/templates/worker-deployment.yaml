{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # The namespace memory quota cannot accommodate both the current and
  # replacement pod at once (see helm/litellm/templates/deployment.yaml).
  # Delete the old pod before creating its replacement so an upgrade can
  # proceed within that quota.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentbarn-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # Roll the pods on every deploy of a new commit even when the image
        # tag itself is an unchanged moving tag (e.g. `latest`) — otherwise
        # Helm sees no manifest diff and skips the rollout entirely.
        build-sha: {{ .Values.buildSha | quote }}
      labels:
        {{- include "agentbarn-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Release.Name }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No --queues filter: this worker consumes every queue registered by
          # the domain actor modules api.worker_app imports (currently just
          # event delivery). Adding a domain there is enough; no flag to keep
          # in sync across deployments.
          command:
            - dramatiq
            - api.worker_app
            - --processes
            - "1"
            - --threads
            - "4"
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
            - secretRef:
                name: {{ .Values.litellmApiKeySecretName }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from api.core.config import get_config; from api.domains.events.transport import EventDeliveryTransport; EventDeliveryTransport(get_config()).check_ready()"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
