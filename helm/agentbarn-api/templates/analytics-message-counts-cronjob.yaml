{{- if eq (toString .Values.analyticsEnabled) "true" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-analytics-message-counts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-message-counts
spec:
  schedule: {{ .Values.analyticsMessageCounts.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "agentbarn-api.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: analytics-message-counts
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: analytics-message-counts
              image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - python
                - -c
                - "from api.domains.analytics.message_counts import main; main()"
              envFrom:
                - secretRef:
                    name: {{ .Values.secretName }}
              resources:
                {{- toYaml .Values.worker.resources | nindent 16 }}
{{- end }}
