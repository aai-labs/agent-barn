apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
    - name: ingest
      port: {{ .Values.service.ingestPort }}
      targetPort: {{ .Values.service.ingestPort }}
    {{- if .Values.memory.enabled }}
    - name: memory-runtime
      port: 8004
      targetPort: 8004
    {{- end }}
  selector:
    {{- include "agentbarn-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
