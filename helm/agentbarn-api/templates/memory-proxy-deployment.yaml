{{- if .Values.honchoEnabled }}
# Agents' only route to memory (AF-338): each request is checked against the
# Agent's current state and forwarded to Honcho with a token scoped to its pool,
# so an Agent never holds a Honcho credential it could keep using.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-memory-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-proxy
spec:
  replicas: {{ .Values.memoryProxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentbarn-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: memory-proxy
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        build-sha: {{ .Values.buildSha | quote }}
      labels:
        {{- include "agentbarn-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: memory-proxy
    spec:
      serviceAccountName: {{ .Release.Name }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: memory-proxy
          image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - api.memory_proxy_main:app
            - --host
            - 0.0.0.0
            - --port
            - "8003"
          ports:
            - name: memory-proxy
              containerPort: 8003
          # The secret carries the database URL, the key encryption key and
          # HONCHO_JWT_SECRET, which signs the pool-scoped token each request is
          # forwarded with.
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - name: HONCHO_ENABLED
              value: "true"
            - name: HONCHO_BASE_URL
              value: "{{ .Values.honchoBaseUrl }}"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.memoryProxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-memory-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: memory-proxy
spec:
  type: ClusterIP
  ports:
    - name: memory-proxy
      port: {{ .Values.memoryProxy.service.port }}
      targetPort: 8003
  selector:
    {{- include "agentbarn-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: memory-proxy
{{- end }}
