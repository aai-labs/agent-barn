{{- if .Values.communications.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-communications
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: communications
spec:
  replicas: {{ .Values.communications.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentbarn-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: communications
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        build-sha: {{ .Values.buildSha | quote }}
      labels:
        {{- include "agentbarn-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: communications
    spec:
      serviceAccountName: {{ .Release.Name }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: communications
          image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - api.communications_main:app
            - --host
            - 0.0.0.0
            - --port
            - "8002"
          ports:
            - name: communications
              containerPort: 8002
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.communications.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-communications
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: communications
spec:
  type: ClusterIP
  ports:
    - name: communications
      port: {{ .Values.communications.service.port }}
      targetPort: 8002
  selector:
    {{- include "agentbarn-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: communications
{{- end }}

