apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-artifact-provisioner
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentbarn-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: artifact-provisioner
  template:
    metadata:
      labels:
        {{- include "agentbarn-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: artifact-provisioner
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: artifact-provisioner
          image: "{{ .Values.registryPrefix }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "api.domains.artifacts.provisioning"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
            {{- if .Values.artifacts.existingSecret }}
            - secretRef:
                name: {{ .Values.artifacts.existingSecret }}
            {{- end }}
            - secretRef:
                name: {{ .Values.artifacts.provisionerSecret | required "artifacts.provisionerSecret is required for provisioning" }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
