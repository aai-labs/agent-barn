apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DB_CONNECTION_URL: {{ .Values.dbConnectionUrl | required "dbConnectionUrl is required" | quote }}
  SECRET_SIGNING_KEY: {{ .Values.secretSigningKey | required "secretSigningKey is required" | quote }}
  PLATFORM_ADMIN_CREDENTIALS: {{ .Values.platformAdminCredentials | required "platformAdminCredentials is required" | quote }}
  PLATFORM_ADMIN_FULL_NAME: {{ .Values.platformAdminFullName | quote }}
  AGENT_TOKEN_ENCRYPTION_KEY: {{ .Values.agentTokenEncryptionKey | required "agentTokenEncryptionKey is required" | quote }}
  ENVIRONMENT: {{ .Values.environment | required "environment is required" | quote }}
  WEB_APP_URL: {{ .Values.webAppUrl | required "webAppUrl is required" | quote }}
  # Optional: unset leaves email delivery disabled (the app degrades gracefully).
  CLOUDFLARE_ACCOUNT_ID: {{ .Values.cloudflareAccountId | default "" | quote }}
  CLOUDFLARE_API_TOKEN: {{ .Values.cloudflareApiToken | default "" | quote }}
  SENDER_EMAIL: {{ .Values.senderEmail | default "" | quote }}
  # Optional: unset leaves per-Agent email addresses disabled. Both are read by the
  # Communications deployment too, which mounts this same Secret with envFrom.
  AGENT_EMAIL_DOMAIN: {{ .Values.agentEmailDomain | default "" | quote }}
  EMAIL_INBOUND_SECRET: {{ .Values.emailInboundSecret | default "" | quote }}
  # Optional: shared Google OAuth client for the Gmail "Authenticate with Google" flow.
  # Unset leaves the flow disabled (authorize-url returns 503).
  GOOGLE_CLOUD_CLIENT_ID: {{ .Values.googleCloudClientId | default "" | quote }}
  GOOGLE_CLOUD_CLIENT_SECRET: {{ .Values.googleCloudClientSecret | default "" | quote }}
  REDIS_URL: {{ .Values.redisUrl | quote }}
  # Optional: OpenRouter inference key, polled (GET /key) for the key's
  # remaining credit limit metric. Unset leaves the gauge unreported
  # (OpenRouterCreditsUnknown alerts on it).
  OPENROUTER_API_KEY: {{ .Values.openrouterApiKey | default "" | quote }}
  AGENT_FIRECRAWL_API_KEY: {{ .Values.agentFirecrawlApiKey | default "" | quote }}
  # API and Communications both read this shared Secret through envFrom. The
  # API projects native settings into Agent runtime configurations while
  # Communications stops claiming those Platforms' deliveries.
  COMMUNICATIONS_NATIVE_PLATFORMS: {{ .Values.communicationsNativePlatforms | default "" | quote }}
  # Agent Barn's own Telegram bot, shared by every Organization. The API offers the
  # Platform only when both are set and reads the bot's id from the token; only the
  # Communications process calls Telegram with it. Agents get a stand-in token.
  AGENTBARN_TELEGRAM_BOT_TOKEN: {{ .Values.agentbarnTelegramBotToken | default "" | quote }}
  AGENTBARN_TELEGRAM_BOT_USERNAME: {{ .Values.agentbarnTelegramBotUsername | default "" | quote }}
  INGEST_BASE_URL: {{ .Values.ingestBaseUrl | required "ingestBaseUrl is required" | quote }}
  # Basic-auth password for the monitoring release's Prometheus, which the API queries
  # for Agent CPU and memory. Unset leaves those views reporting "unavailable".
  PROMETHEUS_PASSWORD: {{ .Values.prometheus.password | default "" | quote }}
  MEMORY_BASE_URL: "http://{{ .Release.Name }}-memory:8003/memory/v1"
  MEMORY_VIEW_BASE_URL: "http://{{ .Release.Name }}-memory:8003/memory/view/v1"
  MEMORY_DEFAULT_MODEL: {{ .Values.memory.defaultModel | quote }}
  MEMORY_LITELLM_ACTIVE_KEY_HASH: {{ .Values.memory.litellmActiveKeyHash | quote }}
  MEMORY_LITELLM_KEY_HASHES: {{ .Values.memory.litellmKeyHashes | quote }}
  # Required spend-limit defaults. Here rather than on one Deployment because every
  # workload that loads the API config (migrations included) refuses to start
  # without them, and they all read this Secret through envFrom.
  ORGANIZATION_DEFAULT_LLM_BUDGET_USD: {{ .Values.organizationLlmBudgets.defaultOrganizationUsd | toString | required "organizationLlmBudgets.defaultOrganizationUsd is required" | quote }}
  AGENT_DEFAULT_LLM_BUDGET_USD: {{ .Values.organizationLlmBudgets.defaultAgentUsd | toString | required "organizationLlmBudgets.defaultAgentUsd is required" | quote }}
