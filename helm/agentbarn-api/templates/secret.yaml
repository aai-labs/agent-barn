apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentbarn-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DB_CONNECTION_URL: {{ .Values.dbConnectionUrl | required "dbConnectionUrl is required" | quote }}
  SECRET_SIGNING_KEY: {{ .Values.secretSigningKey | required "secretSigningKey is required" | quote }}
  PLATFORM_ADMIN_CREDENTIALS: {{ .Values.platformAdminCredentials | required "platformAdminCredentials is required" | quote }}
  PLATFORM_ADMIN_FULL_NAME: {{ .Values.platformAdminFullName | quote }}
  AGENT_TOKEN_ENCRYPTION_KEY: {{ .Values.agentTokenEncryptionKey | required "agentTokenEncryptionKey is required" | quote }}
  ENVIRONMENT: {{ .Values.environment | required "environment is required" | quote }}
  WEB_APP_URL: {{ .Values.webAppUrl | required "webAppUrl is required" | quote }}
  # Optional: unset leaves email delivery disabled (the app degrades gracefully).
  CLOUDFLARE_ACCOUNT_ID: {{ .Values.cloudflareAccountId | default "" | quote }}
  CLOUDFLARE_API_TOKEN: {{ .Values.cloudflareApiToken | default "" | quote }}
  SENDER_EMAIL: {{ .Values.senderEmail | default "" | quote }}
  # Optional: shared Google OAuth client for the Gmail "Authenticate with Google" flow.
  # Unset leaves the flow disabled (authorize-url returns 503).
  GOOGLE_CLOUD_CLIENT_ID: {{ .Values.googleCloudClientId | default "" | quote }}
  GOOGLE_CLOUD_CLIENT_SECRET: {{ .Values.googleCloudClientSecret | default "" | quote }}
  REDIS_URL: {{ .Values.redisUrl | quote }}
  # Optional: OpenRouter inference key, polled (GET /key) for the key's
  # remaining credit limit metric. Unset leaves the gauge unreported
  # (OpenRouterCreditsUnknown alerts on it).
  OPENROUTER_API_KEY: {{ .Values.openrouterApiKey | default "" | quote }}
  AGENT_FIRECRAWL_API_KEY: {{ .Values.agentFirecrawlApiKey | default "" | quote }}
  INGEST_BASE_URL: {{ .Values.ingestBaseUrl | required "ingestBaseUrl is required" | quote }}
