{{- if .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: 3901}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agentbarn-api}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, artifact-purge]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.ingress.controllerLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 3900}]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: 3901}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
