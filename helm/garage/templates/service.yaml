apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: s3, port: 3900, targetPort: s3}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rpc
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: rpc, port: 3901, targetPort: rpc}]
{{- if gt (int .Values.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ max 1 (sub (int .Values.replicas) 1) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
