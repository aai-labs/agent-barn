image: dxflrs/garage:v2.4.1
imagePullPolicy: IfNotPresent
dnsWaitImage: rancher/mirrored-library-busybox:1.36.1
replicas: 3
clusterDomain: cluster.local
# Bound each RPC attempt below the API S3 client's 30-second read timeout.
rpcTimeoutMilliseconds: 20000
# In-cluster probe deadline; failure detection still spans several ping intervals.
rpcPingTimeoutMilliseconds: 3000
replicationFactor: 3
# Pre-created Secret with one 64-character hexadecimal rpc-secret entry.
existingRpcSecret: garage-rpc
storageClass: ""
metadataSize: 1Gi
dataSize: 10Gi
# Each replica must be on a separate Kubernetes node for independent failure domains.
requireDistinctNodes: true
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}
ingress:
  enabled: false
  className: traefik
  host: ""
  tlsSecret: garage-s3-tls
  controllerNamespace: kube-system
  controllerLabels: {app.kubernetes.io/name: traefik}
  clusterIssuer: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
networkPolicy: true
