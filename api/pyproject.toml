[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.18.5",
    "alembic-postgresql-enum>=1.10.0",
    "bcrypt>=5.0.0",
    "cryptography>=49.0.0",
    "fastapi-injector>=0.9.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "mjml>=0.12.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "pyhamcrest>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "testcontainers[postgres]>=4.15.0",
    "kubernetes>=36.0.3",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "dramatiq[redis,watch]>=2.2.0",
    "redis>=8.1.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "websockets>=17.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]

[tool.ty.environment]
python = ".venv/bin/python"
root = [".."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# B008   - FastAPI dependency injection relies on function calls in default
#          arguments (Query, Body, Injected, Depends, filter objects). This is
#          idiomatic and required, not a bug.
# BLE001 - top-level error handlers intentionally catch broad `Exception`.
# S110   - same as BLE001: best-effort scope/permission probes and error-message
#          formatting intentionally swallow failures and fall back silently.
ignore = ["B008", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# Hermes bundle directories use the runtime's plugin ID rather than a Python
# package name, so the remaining telemetry plugin intentionally has a hyphen.
"domains/agents/scripts/hermes/plugins/telemetry-push/__init__.py" = ["N999"]
# SIM117 - tests use a given/when/then BDD DSL where each nested `with` is a
#          deliberate narrative block; merging them loses that structure.
"tests/**" = ["SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/tests/*",
    "migrations/*",
    "*/migrations/*"
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]
